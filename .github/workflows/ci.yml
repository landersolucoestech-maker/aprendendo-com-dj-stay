name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_PROJECT_ID: uonsgcndzzuclcixoaei
      VITE_SUPABASE_URL: https://uonsgcndzzuclcixoaei.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: node scripts/run-eslint-ci.mjs > eslint-report.txt 2>&1

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Typecheck
        run: npm run typecheck > typecheck-report.txt 2>&1

      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: typecheck-report.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Production build
        run: npm run build > build-report.txt 2>&1

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.txt
          if-no-files-found: ignore
          retention-days: 3
