name: Contratos remotos das Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "scripts/check-remote-edge-contracts.mjs"
      - ".github/workflows/remote-edge-contracts.yml"

permissions:
  contents: read

concurrency:
  group: remote-edge-contracts-dev
  cancel-in-progress: true

jobs:
  remote-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_DEV_FUNCTIONS_BASE_URL: https://jmtyurketfclaneqxohu.supabase.co/functions/v1
      EDGE_SMOKE_ALLOWED_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0

      - name: Verificar contratos sem mutação
        run: node scripts/check-remote-edge-contracts.mjs

      - name: Exportar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remote-edge-contracts-${{ github.sha }}
          path: artifacts/remote-edge-contracts/evidence.json
          retention-days: 1
          if-no-files-found: warn
