name: Integrar gate B73

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/integrate-b73-gate.yml"

permissions:
  contents: write

concurrency:
  group: integrate-b73-gate
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Integrar contrato B73
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "package.json";
          const packageJson = JSON.parse(fs.readFileSync(path, "utf8"));
          const marker = "npm run check:marketplace-contract-tests";
          const addition = "npm run check:contact-contract-tests";

          packageJson.scripts["check:contact-contract-tests"] =
            "node scripts/check-contact-contract-tests.mjs";

          if (!packageJson.scripts.typecheck.includes(addition)) {
            if (!packageJson.scripts.typecheck.includes(marker)) {
              throw new Error("Marcador B72 não encontrado no typecheck.");
            }
            packageJson.scripts.typecheck = packageJson.scripts.typecheck.replace(
              `${marker} &&`,
              `${marker} && ${addition} &&`,
            );
          }

          fs.writeFileSync(path, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      - name: Publicar integração
        run: |
          rm .github/workflows/integrate-b73-gate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json .github/workflows/integrate-b73-gate.yml
          git commit -m "test(b73): integrar contratos de contatos ao gate"
          git push origin HEAD:dev
