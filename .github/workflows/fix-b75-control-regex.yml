name: Corrigir lint B75

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/fix-b75-control-regex.yml"

permissions:
  contents: write

concurrency:
  group: fix-b75-control-regex
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Substituir regex de caracteres de controle
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/contracts/storage.ts")
          source = path.read_text(encoding="utf-8")

          anchor = '''const includesText = (values: readonly string[], value: string): boolean =>
            values.includes(value);
          '''
          helper = '''const includesText = (values: readonly string[], value: string): boolean =>
            values.includes(value);

          const hasControlCharacter = (value: string): boolean =>
            Array.from(value).some((character) => {
              const code = character.charCodeAt(0);
              return code <= 31 || code === 127;
            });
          '''
          if anchor not in source:
              raise SystemExit("Âncora includesText não encontrada.")
          source = source.replace(anchor, helper, 1)

          old = '!/[\\u0000-\\u001f\\u007f]/.test(value)'
          if source.count(old) != 1:
              raise SystemExit(f"Esperava 1 validação de nome original; encontrei {source.count(old)}.")
          source = source.replace(old, '!hasControlCharacter(value)', 1)

          old_file = '!/[\\u0000-\\u001f\\u007f]/.test(file.name)'
          if source.count(old_file) != 1:
              raise SystemExit(f"Esperava 1 validação de File; encontrei {source.count(old_file)}.")
          source = source.replace(old_file, '!hasControlCharacter(file.name)', 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Publicar correção
        run: |
          rm .github/workflows/fix-b75-control-regex.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/contracts/storage.ts .github/workflows/fix-b75-control-regex.yml
          git commit -m "fix(b75): validar caracteres de controle sem regex"
          git push origin HEAD:dev
