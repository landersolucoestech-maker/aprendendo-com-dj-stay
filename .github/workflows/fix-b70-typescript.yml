name: Corrigir TypeScript B70

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/fix-b70-typescript.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: fix-b70-typescript
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Corrigir parser datetime-local
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/contracts/curriculum-cms.ts")
          source = path.read_text(encoding="utf-8")
          old = '''const isValidDateTimeLocal = (value: string): boolean => {
            if (!dateTimeLocalPattern.test(value)) return false;

            const [datePart, timePart] = value.split("T");
            const [year, month, day] = datePart.split("-").map(Number);
            const [hour, minute] = timePart.split(":").map(Number);
            const date = new Date(value);

            return (
              !Number.isNaN(date.getTime()) &&
              date.getFullYear() === year &&
              date.getMonth() === month - 1 &&
              date.getDate() === day &&
              date.getHours() === hour &&
              date.getMinutes() === minute
            );
          };'''
          new = '''const isValidDateTimeLocal = (value: string): boolean => {
            if (!dateTimeLocalPattern.test(value)) return false;

            const year = Number(value.slice(0, 4));
            const month = Number(value.slice(5, 7));
            const day = Number(value.slice(8, 10));
            const hour = Number(value.slice(11, 13));
            const minute = Number(value.slice(14, 16));
            const date = new Date(value);

            return (
              !Number.isNaN(date.getTime()) &&
              date.getFullYear() === year &&
              date.getMonth() === month - 1 &&
              date.getDate() === day &&
              date.getHours() === hour &&
              date.getMinutes() === minute
            );
          };'''

          if old not in source:
              raise SystemExit("Trecho esperado não encontrado; patch abortado.")

          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Publicar correção e remover workflow temporário
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/fix-b70-typescript.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/contracts/curriculum-cms.ts .github/workflows/fix-b70-typescript.yml
          git commit -m "fix(b70): tornar parser datetime local type-safe"
          git push origin HEAD:dev

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/baseline.yml/dispatches" \
            --data '{"ref":"dev"}'
