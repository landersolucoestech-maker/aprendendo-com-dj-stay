name: Patch B85 Profile Routes

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-b85-profile-routes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Aplicar rotas B85
        shell: python
        run: |
          from pathlib import Path

          app_path = Path("src/App.tsx")
          app = app_path.read_text(encoding="utf-8")
          old_student_route = 'path="/aluno/perfil/editar" element={<StudentRoute><EditProfile /></StudentRoute>}'
          new_student_route = 'path="/aluno/perfil/editar" element={<StudentRoute><EditProfile studentPortal /></StudentRoute>}'
          if new_student_route not in app:
              if old_student_route not in app:
                  raise SystemExit("Rota específica do aluno não encontrada")
              app = app.replace(old_student_route, new_student_route, 1)
          generic_route = 'path="/editar-perfil"'
          if generic_route not in app or '<EditProfile />' not in app:
              raise SystemExit("Rota genérica de perfil não foi preservada")
          app_path.write_text(app, encoding="utf-8")

          portal_path = Path("src/pages/student/StudentPortal.tsx")
          portal = portal_path.read_text(encoding="utf-8")
          old_link = '<Link to="/editar-perfil">Editar perfil</Link>'
          new_link = '<Link to="/aluno/perfil/editar">Editar perfil</Link>'
          if new_link not in portal:
              if old_link not in portal:
                  raise SystemExit("Link de edição do perfil não encontrado")
              portal = portal.replace(old_link, new_link, 1)
          portal_path.write_text(portal, encoding="utf-8")

      - name: Remover workflow temporário
        run: rm .github/workflows/patch-b85-profile-routes.yml

      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/pages/student/StudentPortal.tsx .github/workflows/patch-b85-profile-routes.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(b85): manter edição de perfil no shell do aluno"
          git push origin HEAD:dev
