name: Ajustar handoff de navegação rápida

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/fast-client-navigation-contract.yml"

permissions:
  contents: write

concurrency:
  group: fast-client-navigation-contract-dev
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm

      - name: Aplicar contrato e validar navegação real
        shell: bash
        env:
          VITE_APP_ENV: development
          VITE_CI_RUNTIME_SMOKE: "true"
          VITE_SUPABASE_URL: https://jmtyurketfclaneqxohu.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_runtime_smoke_only_not_for_deployment
        run: |
          set -euo pipefail
          node scripts/apply-fast-client-navigation-contract.mjs
          npm ci
          npm run build:dev
          node scripts/run-browser-client-navigation-smoke.mjs
          node scripts/check-browser-network-isolation.mjs

      - name: Persistir somente o contrato aprovado
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-fast-client-navigation-contract.mjs
          git restore .github/workflows
          git config user.name "landersolucoestech-maker"
          git config user.email "landersolucoestech@gmail.com"
          git add -A
          git diff --cached --stat
          git commit -m "test(accessibility): allow direct final focus without fallback race"
          git push origin HEAD:dev
