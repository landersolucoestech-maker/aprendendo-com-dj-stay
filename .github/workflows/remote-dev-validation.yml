name: Homologação HTTP do Supabase dev

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/remote-dev-validation.yml"

permissions:
  contents: read

concurrency:
  group: remote-dev-http-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://jmtyurketfclaneqxohu.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oEbblhUiNPSVUfpZaX8O7Q_iVJ5qYgp
      CATALOG_REQUESTS: "200"
      CATALOG_CONCURRENCY: "10"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0

      - name: Executar carga pública e rate limit real
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/remote-dev-validation

          node <<'NODE'
          import { randomUUID } from "node:crypto";
          import { writeFile } from "node:fs/promises";
          import { performance } from "node:perf_hooks";

          const url = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_PUBLISHABLE_KEY;
          const totalRequests = Number(process.env.CATALOG_REQUESTS ?? "200");
          const concurrency = Number(process.env.CATALOG_CONCURRENCY ?? "10");
          const runId = process.env.GITHUB_RUN_ID ?? randomUUID();
          const commit = process.env.GITHUB_SHA ?? "unknown";
          const contactMarker = `REMOTE-HTTP-VALIDATION-${runId}`;

          if (!url || !key) throw new Error("Supabase dev URL/key ausentes.");
          if (!Number.isInteger(totalRequests) || totalRequests < 1 || totalRequests > 1000) {
            throw new Error("CATALOG_REQUESTS fora do limite 1..1000.");
          }
          if (!Number.isInteger(concurrency) || concurrency < 1 || concurrency > 25) {
            throw new Error("CATALOG_CONCURRENCY fora do limite 1..25.");
          }

          const rpc = async (name, body) => {
            const startedAt = performance.now();
            const response = await fetch(`${url}/rest/v1/rpc/${name}`, {
              method: "POST",
              headers: {
                apikey: key,
                authorization: `Bearer ${key}`,
                "content-type": "application/json",
                accept: "application/json",
                "user-agent": `dj-stay-remote-validation/${commit.slice(0, 12)}`,
              },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(15_000),
            });
            const elapsedMs = performance.now() - startedAt;
            const rawBody = await response.text();
            let data = null;
            try {
              data = rawBody ? JSON.parse(rawBody) : null;
            } catch {
              data = rawBody;
            }
            return { status: response.status, ok: response.ok, elapsedMs, data };
          };

          const durations = [];
          const catalogFailures = [];
          let nextIndex = 0;

          const worker = async () => {
            while (true) {
              const index = nextIndex++;
              if (index >= totalRequests) return;

              try {
                const result = await rpc("get_public_course_catalog", {});
                durations.push(result.elapsedMs);
                if (
                  !result.ok ||
                  typeof result.data !== "object" ||
                  result.data === null ||
                  !Array.isArray(result.data.courses)
                ) {
                  catalogFailures.push({ index, status: result.status, data: result.data });
                }
              } catch (error) {
                catalogFailures.push({ index, error: String(error) });
              }
            }
          };

          const loadStartedAt = performance.now();
          await Promise.all(Array.from({ length: concurrency }, () => worker()));
          const loadElapsedMs = performance.now() - loadStartedAt;

          const sorted = [...durations].sort((a, b) => a - b);
          const percentile = (ratio) => {
            if (sorted.length === 0) return null;
            return sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * ratio))];
          };
          const average = sorted.length
            ? sorted.reduce((sum, value) => sum + value, 0) / sorted.length
            : null;

          const contactAttempts = [];
          for (let attempt = 1; attempt <= 6; attempt += 1) {
            const result = await rpc("submit_contact_message", {
              p_name: "Homologacao HTTP automatica",
              p_email: `remote.http+${runId}.${attempt}@example.com`,
              p_subject: contactMarker,
              p_message: "Mensagem transitoria para validar o limite anonimo real do gateway Supabase dev.",
              p_idempotency_key: randomUUID(),
            });
            contactAttempts.push({
              attempt,
              status: result.status,
              ok: result.ok,
              elapsedMs: result.elapsedMs,
              data: result.data,
            });
          }

          const firstFiveAccepted = contactAttempts
            .slice(0, 5)
            .every((attempt) => attempt.ok && attempt.data?.persisted === true);
          const sixth = contactAttempts[5];
          const sixthBody = JSON.stringify(sixth?.data ?? "");
          const sixthRateLimited =
            Boolean(sixth) &&
            !sixth.ok &&
            (sixthBody.includes("RATE_LIMITED") || sixth?.data?.code === "P0001");

          const result = {
            branch: process.env.GITHUB_REF_NAME,
            commit,
            runId,
            contactMarker,
            catalog: {
              requests: totalRequests,
              concurrency,
              successfulResponses: durations.length - catalogFailures.length,
              failures: catalogFailures,
              wallClockMs: Number(loadElapsedMs.toFixed(2)),
              averageMs: average === null ? null : Number(average.toFixed(2)),
              p50Ms: percentile(0.5) === null ? null : Number(percentile(0.5).toFixed(2)),
              p95Ms: percentile(0.95) === null ? null : Number(percentile(0.95).toFixed(2)),
              p99Ms: percentile(0.99) === null ? null : Number(percentile(0.99).toFixed(2)),
            },
            contactRateLimit: {
              firstFiveAccepted,
              sixthRateLimited,
              attempts: contactAttempts,
            },
          };

          await writeFile(
            "artifacts/remote-dev-validation/result.json",
            `${JSON.stringify(result, null, 2)}\n`,
          );
          console.log(JSON.stringify(result, null, 2));

          if (catalogFailures.length > 0) {
            throw new Error(`Falharam ${catalogFailures.length} chamadas do catálogo.`);
          }
          if (!firstFiveAccepted) {
            throw new Error("As cinco primeiras submissões de contato não foram aceitas como esperado.");
          }
          if (!sixthRateLimited) {
            throw new Error("A sexta submissão não foi bloqueada pelo rate limit remoto.");
          }
          NODE

      - name: Exportar evidência remota
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remote-dev-validation-${{ github.sha }}
          path: artifacts/remote-dev-validation
          retention-days: 7
          if-no-files-found: error
