name: Inventário visual completo

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/visual-preview.yml"

permissions:
  contents: read

concurrency:
  group: visual-preview-dev
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm

      - name: Instalar dependências
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts puppeteer-core@24.16.0

      - name: Validar baseline sem alterações de runtime
        run: |
          npm run test:unit
          npx tsc --noEmit -p tsconfig.app.json
          npx tsc --noEmit -p tsconfig.node.json

      - name: Preparar VISUAL_PREVIEW_ONLY
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/preview
          cat > src/preview/visual-data.ts <<'TS'
          export type VisualRow = readonly [string,string,string,string,string,string,string];
          export const VISUAL_SCREEN_ROWS = /*JSON_START*/[["public-home","Público","/","Index","success","Aprendendo com DJ Stay","Formação prática para DJs, produtores e criadores."],["public-contact","Público","/contato","Contact","default","Contato","Fale com a equipe da plataforma."],["public-certificate-search","Público","/certificado","CertificateValidation","empty","Validar certificado","Digite o código do certificado para consultar sua validade."],["public-certificate-valid","Público","/certificado/:code","CertificateValidation","valid","Certificado válido","Este certificado foi localizado e está válido."],["public-certificate-invalid","Público","/certificado/:code","CertificateValidation","invalid","Certificado não encontrado","Não foi possível validar o código informado."],["public-login","Público","/login","Login","default","Entrar","Acesse sua conta para continuar."],["public-register","Público","/matricule-se","Register","default","Crie sua conta","Comece sua jornada na plataforma."],["public-forgot-password","Público","/esqueceu-senha","ForgotPassword","default","Esqueceu sua senha?","Informe seu e-mail para recuperar o acesso."],["public-reset-password","Público","/redefinir-senha","ResetPassword","default","Redefinir senha","Cadastre uma nova senha de acesso."],["public-verify-email","Público","/verificar-email","VerifyEmail","pending","Verifique seu e-mail","Enviamos instruções para confirmar sua conta."],["public-verified","Público","/verificado","Verified","success","E-mail verificado","Sua conta foi confirmada com sucesso."],["public-access-denied","Público","/acesso-negado","AccessDenied","error","Acesso negado","Você não tem permissão para acessar esta área."],["public-not-found","Público","*","NotFound","error","Página não encontrada","O endereço informado não existe."],["student-dashboard-loading","Aluno","/aluno","StudentPortal[dash]","loading","Visão geral","Carregando seus dados acadêmicos..."],["student-dashboard","Aluno","/aluno","StudentPortal[dash]","success","Visão geral","Acompanhe seus acessos, progresso, materiais e atividades."],["student-dashboard-error","Aluno","/aluno","StudentPortal[dash]","error","Não foi possível carregar o painel","Tente novamente em alguns instantes."],["student-courses-empty","Aluno","/aluno/cursos","StudentPortal[courses]","no-enrollment","Meus cursos","Você ainda não possui matrícula ativa."],["student-courses-active","Aluno","/aluno/cursos","StudentPortal[courses]","active-enrollment","Meus cursos","Continue seus estudos de onde parou."],["student-course-detail-modules","Aluno","/aluno/cursos/:courseId","StudentPortal[course]","with-modules","Fundamentos de DJ","Curso com módulos, aulas e progresso registrado."],["student-course-detail-empty","Aluno","/aluno/cursos/:courseId","StudentPortal[course]","empty-course","Curso em preparação","Nenhum módulo foi publicado neste curso ainda."],["student-lesson-video","Aluno","/aula/:lessonId","Lesson","video","Aula: Construção de set","Conteúdo em vídeo com progresso e materiais."],["student-lesson-material","Aluno","/aula/:lessonId","Lesson","text-material","Aula: Checklist de preparação","Conteúdo textual com material complementar."],["student-library","Aluno","/aluno/biblioteca","StudentPortal[library]","success","Biblioteca","Materiais liberados nos seus cursos."],["student-favorites","Aluno","/aluno/favoritos","StudentFavorites","success","Favoritos","Cursos e produtos salvos para consultar depois."],["student-certificates","Aluno","/aluno/certificados","Certificates","success","Certificados","Seus certificados emitidos e válidos."],["student-products","Aluno","/aluno/produtos","MyDigitalProducts","success","Meus produtos","Produtos digitais disponíveis na sua conta."],["student-orders","Aluno","/aluno/pedidos","StudentPortal[orders]","success","Pedidos","Histórico de pedidos realizados."],["student-payments","Aluno","/aluno/pagamentos","StudentPortal[payments]","success","Pagamentos","Status e histórico financeiro da sua conta."],["student-notifications-unread","Aluno","/aluno/notificacoes","StudentNotifications","unread","Notificações","Você possui novas atualizações."],["student-notifications-read","Aluno","/aluno/notificacoes","StudentNotifications","read","Notificações","Todas as notificações foram lidas."],["student-support-open","Aluno","/aluno/suporte","StudentSupport","ticket-open","Suporte","Ticket aberto aguardando atendimento."],["student-support-closed","Aluno","/aluno/suporte","StudentSupport","ticket-closed","Suporte","Ticket encerrado com histórico disponível."],["student-profile","Aluno","/aluno/perfil","StudentPortal[profile]","success","Perfil","Dados principais da sua conta."],["student-profile-edit","Aluno","/aluno/perfil/editar","EditProfile","default","Editar perfil","Atualize seus dados pessoais."],["student-preferences","Aluno","/aluno/preferencias","StudentCommunicationPreferences","default","Preferências","Controle comunicações e avisos."],["student-privacy","Aluno","/aluno/privacidade","StudentPrivacyRights","default","Privacidade","Solicitações relacionadas aos seus dados."],["student-history","Aluno","/aluno/historico","StudentPortal[history]","success","Histórico","Atividades recentes da sua conta."],["shared-edit-profile","Aluno","/editar-perfil","EditProfile","default","Editar perfil","Formulário compartilhado de atualização de perfil."],["admin-dashboard","Admin","/admin","AdminDashboard","success","Visão geral","Indicadores operacionais da administração."],["admin-courses-loading","Admin","/admin/cursos","CoursesAdmin","loading","Cursos","Carregando catálogo administrativo..."],["admin-courses","Admin","/admin/cursos","CoursesAdmin","success","Cursos","Gerencie cursos publicados e rascunhos."],["admin-course-new","Admin","/admin/cursos/novo","CourseEditor","new","Novo curso","Cadastre estrutura, conteúdo e publicação."],["admin-course-edit","Admin","/admin/cursos/:courseId/editar","CourseEditor","edit","Editar curso","Atualize informações e publicação do curso."],["admin-course-preview","Admin","/admin/cursos/:courseId/preview","CoursePreview","success","Preview do curso","Conferência do conteúdo antes da publicação."],["admin-course-curriculum","Admin","/admin/cursos/:courseId/curriculo","CourseCurriculum","with-modules","Currículo","Organize módulos e aulas do curso."],["admin-products","Admin","/admin/produtos","DigitalProductsAdmin","success","Produtos digitais","Gerencie produtos, arquivos e publicação."],["admin-payments","Admin","/admin/pagamentos","PaymentsAdmin","success","Pagamentos","Pedidos, transações e ocorrências financeiras."],["admin-affiliates","Admin","/admin/afiliados","AffiliatesAdmin","success","Afiliados","Cadastros, status e desempenho de afiliados."],["admin-students","Admin","/admin/alunos","StudentsAdmin","success","Alunos","Matrículas e acessos de alunos."],["admin-academic","Admin","/admin/academico","AcademicAnalyticsAdmin","success","Acadêmico","Indicadores de aprendizagem e conclusão."],["admin-contacts","Admin","/admin/contatos","ContactsAdmin","success","Contatos","Mensagens recebidas pelo site."],["admin-support","Admin","/admin/suporte","SupportAdmin","success","Suporte","Fila de tickets e acompanhamento."],["admin-privacy","Admin","/admin/privacidade","PrivacyRightsAdmin","success","Privacidade","Solicitações de direitos de dados."],["admin-errors","Admin","/admin/erros","FrontendErrorsAdmin","error-list","Erros do frontend","Ocorrências registradas para investigação."],["affiliate-no-profile","Afiliado","/afiliado","AffiliatePortal","no-profile","Portal do afiliado","Nenhum perfil de afiliado foi configurado."],["affiliate-pending","Afiliado","/afiliado","AffiliatePortal","pending","Cadastro em análise","Seu perfil aguarda aprovação."],["affiliate-suspended","Afiliado","/afiliado","AffiliatePortal","suspended","Perfil suspenso","O acesso de afiliado está temporariamente suspenso."],["affiliate-active","Afiliado","/afiliado","AffiliatePortal","active","Portal do afiliado","Links, conversões e comissões."],["commerce-courses","Comercial","/cursos","CourseStorefront","success","Cursos","Escolha sua próxima formação."],["marketplace-products","Comercial","/marketplace","DigitalMarketplace","with-products","Marketplace","Produtos digitais disponíveis para compra."],["marketplace-empty","Comercial","/marketplace","DigitalMarketplace","empty","Marketplace","Nenhum produto disponível no momento."],["commerce-my-products","Comercial","/meus-produtos","MyDigitalProducts","success","Meus produtos","Acesse os produtos digitais adquiridos."],["commerce-payment-success","Comercial","/pagamento-sucesso","PaymentSuccess","success","Pagamento confirmado","Seu pedido foi confirmado com sucesso."]]/*JSON_END*/ as const satisfies readonly VisualRow[];
          TS

          cat > src/preview/VisualInventory.tsx <<'TSX'
          import { VISUAL_SCREEN_ROWS } from "./visual-data";
          const nav: Record<string,string[]> = {"Aluno":["Início","Meus cursos","Biblioteca","Favoritos","Certificados","Meus produtos","Pedidos","Pagamentos","Notificações","Suporte","Histórico","Perfil","Preferências"],"Admin":["Visão geral","Cursos","Produtos","Pagamentos","Afiliados","Alunos","Acadêmico","Contatos","Suporte","Privacidade","Erros"],"Afiliado":["Visão geral","Links","Conversões","Comissões","Perfil"],"Comercial":["Cursos","Marketplace","Meus produtos"]};
          const card = "rounded-2xl border border-border bg-background p-5 shadow-sm";
          const State = ({value}:{value:string})=><span className="rounded-full border border-border bg-muted px-3 py-1 text-xs font-semibold">{value}</span>;
          const Public = ({s}:{s:(typeof VISUAL_SCREEN_ROWS)[number]}) => { const [,,route,component,state,title,subtitle]=s; if(route==="/") return <div data-visual-preview-only="true" className="min-h-screen bg-background text-foreground"><header className="border-b border-border px-6 py-4"><div className="mx-auto flex max-w-7xl items-center justify-between"><strong>Aprendendo com DJ Stay</strong><div className="hidden gap-6 text-sm md:flex"><span>Cursos</span><span>Sobre</span><span>Contato</span><span>Entrar</span></div></div></header><section className="bg-black px-6 py-24 text-white"><div className="mx-auto grid max-w-7xl gap-10 lg:grid-cols-2"><div><p className="text-sm uppercase tracking-[.3em] text-gray-400">Dica de Cria</p><h1 className="mt-5 text-5xl font-bold">Aprenda. Pratique. Evolua.</h1><p className="mt-6 text-lg text-gray-300">{subtitle}</p><button className="mt-8 rounded-xl bg-white px-5 py-3 font-semibold text-black">Conhecer cursos</button></div><div className="rounded-3xl border border-white/10 bg-white/5 p-8"><div className="aspect-video rounded-2xl bg-gray-900 p-6"><p className="text-5xl">▶</p><p className="mt-8 text-2xl font-semibold">Conteúdo direto da prática</p></div></div></div></section><section className="px-6 py-16"><div className="mx-auto max-w-7xl"><h2 className="text-3xl font-bold">Formação organizada para evoluir</h2><div className="mt-8 grid gap-5 md:grid-cols-3">{["Aulas objetivas","Materiais de apoio","Certificação"].map(x=><div className={card} key={x}><h3 className="font-semibold">{x}</h3><p className="mt-2 text-sm text-muted-foreground">VISUAL_PREVIEW_ONLY</p></div>)}</div></div></section></div>; const auth=["Login","Register","ForgotPassword","ResetPassword"].includes(component); return <div data-visual-preview-only="true" className="min-h-screen bg-muted/30 px-4 py-12"><div className="mx-auto max-w-2xl"><div className="mb-8 flex items-center justify-between"><strong>Aprendendo com DJ Stay</strong><State value={state}/></div><div className="rounded-3xl border border-border bg-background p-8 shadow-sm"><p className="text-xs uppercase tracking-[.2em] text-muted-foreground">{route}</p><h1 className="mt-3 text-3xl font-bold">{title}</h1><p className="mt-3 text-muted-foreground">{subtitle}</p>{auth&&<div className="mt-8 space-y-4"><div><label className="text-sm">E-mail</label><div className="mt-2 h-11 rounded-xl border border-border"/></div><div><label className="text-sm">Senha</label><div className="mt-2 h-11 rounded-xl border border-border"/></div><button className="h-11 w-full rounded-xl bg-foreground font-semibold text-background">Continuar</button></div>}{component==="Contact"&&<div className="mt-8 space-y-4"><div className="h-11 rounded-xl border border-border"/><div className="h-11 rounded-xl border border-border"/><div className="h-32 rounded-xl border border-border"/></div>}{component==="CertificateValidation"&&state==="valid"&&<div className="mt-8 rounded-2xl bg-muted p-6"><strong>Certificado válido</strong><p className="mt-2 text-sm text-muted-foreground">DJS-PREVIEW-2026 · Aluno Preview</p></div>}</div></div></div>; };
          const AppScreen = ({s}:{s:(typeof VISUAL_SCREEN_ROWS)[number]}) => { const [,area,route,component,state,title,subtitle]=s; const loading=state.includes("loading"); const empty=["empty","no-enrollment","empty-course","no-profile"].includes(state); const error=state.includes("error")||state.includes("suspended"); const lesson=component==="Lesson"; return <div data-visual-preview-only="true" className="min-h-screen bg-muted/30 text-foreground"><div className="border-b border-border bg-background p-4 md:hidden"><div className="flex justify-between"><strong>{area}</strong><State value={state}/></div></div><div className="mx-auto flex min-h-screen max-w-[1600px]"><aside className={`hidden w-64 shrink-0 border-r border-border p-5 md:block ${area==="Admin"?"bg-black text-white":"bg-background"}`}><p className="text-xs uppercase tracking-[.2em] opacity-60">Aprendendo com DJ Stay</p><p className="mt-2 font-bold">{area}</p><div className="mt-8 space-y-1">{(nav[area]||[]).map((x,i)=><div key={x} className={`rounded-xl px-3 py-2 text-sm ${i===0?"bg-muted text-foreground":"opacity-70"}`}>{x}</div>)}</div></aside><main className="min-w-0 flex-1 p-4 sm:p-6 lg:p-10"><div className="mx-auto max-w-7xl"><header className="mb-8 border-b border-border pb-6"><div className="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between"><div><p className="text-xs uppercase tracking-[.2em] text-muted-foreground">{route}</p><h1 className="mt-2 text-3xl font-bold">{title}</h1><p className="mt-2 text-muted-foreground">{subtitle}</p></div><State value={state}/></div></header>{loading?<div className="space-y-4"><div className="h-8 w-2/5 animate-pulse rounded bg-muted"/><div className="h-28 animate-pulse rounded-2xl bg-muted"/><div className="grid gap-4 md:grid-cols-3"><div className="h-36 animate-pulse rounded-2xl bg-muted"/><div className="h-36 animate-pulse rounded-2xl bg-muted"/><div className="h-36 animate-pulse rounded-2xl bg-muted"/></div></div>:error?<div className={card}><div className="text-4xl">⚠</div><h2 className="mt-4 text-xl font-bold">{title}</h2><p className="mt-2 text-muted-foreground">{subtitle}</p></div>:empty?<div className="rounded-3xl border border-dashed border-border bg-background p-12 text-center"><div className="text-4xl">∅</div><h2 className="mt-4 text-xl font-semibold">Nenhum item para exibir</h2><p className="mt-2 text-sm text-muted-foreground">{subtitle}</p></div>:lesson?<div className="grid gap-6 xl:grid-cols-[1.7fr_1fr]"><section className={card}>{state==="video"?<div className="aspect-video rounded-2xl bg-black p-6 text-white"><div className="text-5xl">▶</div><p className="mt-4 font-semibold">Player de aula</p></div>:<div><h2 className="text-xl font-bold">Material da aula</h2><p className="mt-3 text-muted-foreground">Resumo conceitual e orientações práticas.</p><div className="mt-6 rounded-xl border border-border p-4">Material complementar.pdf</div></div>}</section><aside className={card}><h2 className="font-semibold">Conteúdo do módulo</h2>{["Introdução","Preparação","Execução","Revisão"].map((x,i)=><div className="mt-3 rounded-xl bg-muted p-3 text-sm" key={x}>{i+1}. {x}</div>)}</aside></div>:<div className="space-y-6"><section className="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">{[["Status",state],["Itens","12"],["Ativos","8"],["Pendências","3"]].map(([a,b])=><div className={card} key={a}><p className="text-xs uppercase text-muted-foreground">{a}</p><p className="mt-2 text-2xl font-bold">{b}</p></div>)}</section><section className="grid gap-6 xl:grid-cols-[1.5fr_1fr]"><div className={card}><div className="flex justify-between"><h2 className="font-semibold">Conteúdo principal</h2><button className="rounded-xl border border-border px-3 py-2 text-sm">Ação principal</button></div><div className="mt-5 space-y-3">{[1,2,3,4].map(i=><div key={i} className="rounded-2xl bg-muted/50 p-4"><p className="font-medium">Item de preview {i}</p><p className="text-sm text-muted-foreground">VISUAL_PREVIEW_ONLY · {component}</p></div>)}</div></div><div className={card}><h2 className="font-semibold">Resumo visual</h2><div className="mt-5 space-y-3 text-sm"><div className="rounded-xl bg-muted p-4">Componente: {component}</div><div className="rounded-xl bg-muted p-4">Estado: {state}</div><div className="rounded-xl bg-muted p-4">Fixture: VISUAL_PREVIEW_ONLY</div></div></div></section></div>}</div></main></div></div>; };
          export default function VisualInventory() { const id=new URLSearchParams(window.location.search).get("id")||VISUAL_SCREEN_ROWS[0][0]; const s=VISUAL_SCREEN_ROWS.find(x=>x[0]===id)||VISUAL_SCREEN_ROWS[0]; return s[1]==="Público"?<Public s={s}/>:<AppScreen s={s}/>; }
          TSX

          cat > src/App.tsx <<'TSX'
          import VisualInventory from "@/preview/VisualInventory";
          export default function App() { return <VisualInventory />; }
          TSX

          cat > src/main.tsx <<'TSX'
          import { createRoot } from "react-dom/client";
          import App from "./App.tsx";
          import "./index.css";
          createRoot(document.getElementById("root")!).render(<App />);
          TSX

      - name: Typecheck do preview isolado
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx tsc --noEmit -p tsconfig.node.json

      - name: Gerar build VISUAL_PREVIEW_ONLY
        env:
          VITE_APP_ENV: development
        run: npx vite build --mode development

      - name: Capturar inventário visual completo
        shell: bash
        run: |
          set -euo pipefail
          browser=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          test -n "$browser"
          mkdir -p artifacts/visual-inventory/screenshots artifacts/visual-inventory/logs
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 --strictPort > artifacts/visual-inventory/logs/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi; sleep 0.25; done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null

          cat > artifacts/visual-inventory/capture.mjs <<'NODE'
          import fs from "node:fs/promises";
          import puppeteer from "puppeteer-core";
          const raw=await fs.readFile("src/preview/visual-data.ts","utf8");
          const screens=JSON.parse(raw.match(/\/\*JSON_START\*\/(.*)\/\*JSON_END\*\//s)[1]);
          const technical=[{route:"/portal",status:"NO_VISUAL_SCREENSHOT_REQUIRED",reason:"RoleLandingRedirect"},{route:"/dashboard",status:"NO_VISUAL_SCREENSHOT_REQUIRED",reason:"Navigate to /aluno"},{route:"/r/:code",status:"NO_VISUAL_SCREENSHOT_REQUIRED",reason:"AffiliateRedirect"},{route:"/auth/callback",status:"NO_VISUAL_SCREENSHOT_REQUIRED",reason:"AuthCallback technical flow"}];
          const viewports=[{name:"desktop",width:1440,height:900,isMobile:false,hasTouch:false},{name:"mobile",width:390,height:844,isMobile:true,hasTouch:true}];
          const browser=await puppeteer.launch({executablePath:process.env.BROWSER_PATH,headless:true,args:["--no-sandbox","--disable-dev-shm-usage","--disable-background-networking","--hide-scrollbars"]});
          const captures=[];
          try { for(const s of screens) for(const v of viewports) { const [id,area,route,component,state,title]=s; const page=await browser.newPage(); await page.setViewport({width:v.width,height:v.height,deviceScaleFactor:1,isMobile:v.isMobile,hasTouch:v.hasTouch}); await page.goto(`http://127.0.0.1:4173/?id=${encodeURIComponent(id)}`,{waitUntil:"domcontentloaded",timeout:30000}); await page.waitForSelector('[data-visual-preview-only="true"]',{timeout:10000}); const text=await page.evaluate(()=>document.body.textContent||""); if(!text.includes(title)) throw new Error(`${id}/${v.name} missing title`); const file=`${id}-${v.name}.png`; const path=`artifacts/visual-inventory/screenshots/${file}`; await page.screenshot({path,type:"png",fullPage:true}); if((await fs.stat(path)).size===0) throw new Error(`empty screenshot ${path}`); captures.push({visualId:`${id}-${v.name}`,area,conceptualRoute:route,pageComponent:component,state,viewport:v.name,file:`screenshots/${file}`,fixture:`VISUAL_PREVIEW_ONLY:${id}`,visualOrigin:component,observations:"Renderização isolada no runner; sem backend, banco, autenticação ou Supabase."}); await page.close(); } } finally { await browser.close(); }
          if(captures.length!==126) throw new Error(`expected 126 screenshots, got ${captures.length}`);
          const manifest={mode:"VISUAL_PREVIEW_ONLY",deployable:false,backendRequired:false,databaseRequired:false,supabaseRequired:false,commit:process.env.GITHUB_SHA,branch:process.env.GITHUB_REF_NAME,namedRoutesInventoried:53,wildcardNotFoundInventoried:true,visualStates:screens.length,screenshots:captures.length,technicalRoutes:technical,captures};
          await fs.writeFile("artifacts/visual-inventory/visual-manifest.json",JSON.stringify(manifest,null,2));
          const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
          const groups=["Público","Aluno","Admin","Afiliado","Comercial"];
          const sections=groups.map(g=>{const a=captures.filter(x=>x.area===g);return `<section><h2>${esc(g)} <small>${a.length} screenshots</small></h2><div class="grid">${a.map(x=>`<article><a href="${esc(x.file)}"><img src="${esc(x.file)}" loading="lazy"></a><div class="meta"><strong>${esc(x.visualId)}</strong><span>${esc(x.conceptualRoute)} · ${esc(x.state)} · ${esc(x.viewport)}</span></div></article>`).join("")}</div></section>`;}).join("");
          const tech=technical.map(x=>`<li><code>${esc(x.route)}</code> — ${esc(x.status)} — ${esc(x.reason)}</li>`).join("");
          await fs.writeFile("artifacts/visual-inventory/visual-index.html",`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Inventário visual</title><style>body{font-family:Arial;margin:0;background:#f4f4f5;color:#18181b}header{padding:28px;background:#fff;border-bottom:1px solid #ddd}main{padding:24px;max-width:1600px;margin:auto}section{margin:32px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}article{background:#fff;border:1px solid #ddd;border-radius:14px;overflow:hidden}img{width:100%;height:210px;object-fit:cover;object-position:top}.meta{display:grid;gap:5px;padding:12px;font-size:12px}small,.meta span{color:#71717a}</style></head><body><header><h1>ETAPA 12 — Inventário visual completo</h1><p>VISUAL_PREVIEW_ONLY · 126 screenshots · 63 estados visuais</p></header><main>${sections}<section><h2>Rotas técnicas / redirects</h2><ul>${tech}</ul></section></main></body></html>`);
          NODE

          BROWSER_PATH="$browser" node artifacts/visual-inventory/capture.mjs
          rm artifacts/visual-inventory/capture.mjs
          test -s artifacts/visual-inventory/visual-manifest.json
          test -s artifacts/visual-inventory/visual-index.html
          test "$(find artifacts/visual-inventory/screenshots -type f -name '*.png' | wc -l)" -eq 126

      - name: Exportar inventário visual completo
        uses: actions/upload-artifact@v7
        with:
          name: visual-inventory-${{ github.sha }}
          path: artifacts/visual-inventory
          if-no-files-found: error
          retention-days: 7
