name: Prévia visual

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/visual-preview.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tailwind.config.ts"
      - "postcss.config.js"

permissions:
  contents: read

concurrency:
  group: visual-preview-dev
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm

      - name: Instalar dependências
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts puppeteer-core@24.16.0

      - name: Gerar build visual isolado
        env:
          VITE_APP_ENV: development
          VITE_CI_RUNTIME_SMOKE: "true"
          VITE_SUPABASE_URL: https://jmtyurketfclaneqxohu.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_runtime_smoke_only_not_for_deployment
        run: npm run build:dev

      - name: Capturar telas desktop e mobile
        shell: bash
        run: |
          set -euo pipefail

          browser=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              browser="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$browser"
          "$browser" --version

          mkdir -p artifacts/visual-preview/desktop artifacts/visual-preview/mobile artifacts/visual-preview/logs

          node node_modules/vite/bin/vite.js preview \
            --host 127.0.0.1 \
            --port 4173 \
            --strictPort \
            > artifacts/visual-preview/logs/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 80); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              ready=true
              break
            fi
            sleep 0.25
          done
          test "$ready" = true

          cat > artifacts/visual-preview/capture.mjs <<'NODE'
          import fs from "node:fs/promises";
          import puppeteer from "puppeteer-core";

          const baseUrl = "http://127.0.0.1:4173";
          const routes = [
            { name: "home", path: "/" },
            { name: "home-course", path: "/#curso", expectedSection: "curso" },
            { name: "home-instructor", path: "/#instrutor", expectedSection: "instrutor" },
            { name: "home-transparency", path: "/#transparencia", expectedSection: "transparencia" },
            { name: "home-footer", path: "/#contato", expectedSection: "contato" },
            { name: "login", path: "/login" },
            { name: "register", path: "/matricule-se" },
            { name: "forgot-password", path: "/esqueceu-senha" },
            { name: "contact", path: "/contato" },
            { name: "certificate", path: "/certificado" },
            { name: "access-denied", path: "/acesso-negado" },
            { name: "not-found", path: "/rota-inexistente-b122" },
          ];
          const viewports = [
            { name: "desktop", width: 1440, height: 1000 },
            { name: "mobile", width: 390, height: 844, isMobile: true, hasTouch: true },
          ];

          const browser = await puppeteer.launch({
            executablePath: process.env.BROWSER_PATH,
            headless: true,
            args: [
              "--no-sandbox",
              "--disable-dev-shm-usage",
              "--disable-background-networking",
              "--disable-component-update",
              "--disable-default-apps",
              "--disable-extensions",
              "--disable-sync",
              "--metrics-recording-only",
              "--no-first-run",
              "--mute-audio",
              "--hide-scrollbars",
            ],
          });

          const captures = [];

          try {
            for (const viewport of viewports) {
              for (const route of routes) {
                const page = await browser.newPage();
                await page.setViewport({
                  width: viewport.width,
                  height: viewport.height,
                  deviceScaleFactor: 1,
                  isMobile: viewport.isMobile ?? false,
                  hasTouch: viewport.hasTouch ?? false,
                });

                await page.goto(`${baseUrl}${route.path}`, {
                  waitUntil: "domcontentloaded",
                  timeout: 30_000,
                });
                await new Promise((resolve) => setTimeout(resolve, 2_500));
                await page.evaluate(
                  () => new Promise((resolve) =>
                    requestAnimationFrame(() => requestAnimationFrame(resolve)),
                  ),
                );

                const sectionState = route.expectedSection
                  ? await page.evaluate((sectionId) => {
                      const target = document.getElementById(sectionId);
                      if (!target) {
                        return { exists: false, visible: false, scrollY: window.scrollY };
                      }

                      const rect = target.getBoundingClientRect();
                      return {
                        exists: true,
                        visible: rect.bottom > 85 && rect.top < window.innerHeight,
                        scrollY: window.scrollY,
                        top: rect.top,
                        bottom: rect.bottom,
                        viewportHeight: window.innerHeight,
                      };
                    }, route.expectedSection)
                  : null;

                if (route.expectedSection && !sectionState?.visible) {
                  throw new Error(
                    `Section ${route.expectedSection} is not visible for ${viewport.name}/${route.name}: ${JSON.stringify(sectionState)}`,
                  );
                }

                const screenshotPath = `artifacts/visual-preview/${viewport.name}/${route.name}.png`;
                await page.screenshot({
                  path: screenshotPath,
                  type: "png",
                  captureBeyondViewport: false,
                });

                if (route.name === "home") {
                  await page.screenshot({
                    path: `artifacts/visual-preview/${viewport.name}/home-full.png`,
                    type: "png",
                    fullPage: true,
                  });
                }

                captures.push({
                  viewport: viewport.name,
                  route: route.path,
                  name: route.name,
                  sectionState,
                });
                await page.close();
              }
            }
          } finally {
            await browser.close();
          }

          await fs.writeFile(
            "artifacts/visual-preview/manifest.json",
            JSON.stringify(
              {
                commit: process.env.GITHUB_SHA,
                branch: process.env.GITHUB_REF_NAME,
                mode: "development-ci-visual-preview",
                deployable: false,
                viewports: viewports.map(({ name, width, height }) => ({
                  name,
                  width,
                  height,
                })),
                captures,
              },
              null,
              2,
            ),
          );
          NODE

          BROWSER_PATH="$browser" node artifacts/visual-preview/capture.mjs
          rm artifacts/visual-preview/capture.mjs
          find artifacts/visual-preview -maxdepth 3 -type f -print

      - name: Exportar prévia visual
        uses: actions/upload-artifact@v7
        with:
          name: visual-preview-${{ github.sha }}
          path: artifacts/visual-preview
          retention-days: 3
          if-no-files-found: error
