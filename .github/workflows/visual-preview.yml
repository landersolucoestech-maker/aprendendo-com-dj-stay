name: Frontend Dev — Preview Navegável Integral

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/visual-preview.yml"
      - "visual-preview/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: visual-preview-dev
  cancel-in-progress: true

env:
  EXPECTED_MAIN_HEAD: b3a303caff9a19f231616b2b4d9fc65c2d8a557d

jobs:
  validate-build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout dev integral
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Node 22.22.0
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm

      - name: Confirmar dev, topologia e main intacta
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin dev main
          test "$(git branch --show-current)" = "dev"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev)"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_HEAD"
          branches="$(git branch -r | sed -n 's#^[[:space:]]*origin/##p' | grep -v '^HEAD ->' | sort)"
          expected="$(printf '%s\n' dev main | sort)"
          test "$branches" = "$expected"
          echo "HEAD_BEFORE_RUN=$(git rev-parse HEAD)"
          echo "MAIN=$(git rev-parse origin/main)"
          echo "REMOTE_BRANCH_TOPOLOGY=dev,main PASS"

      - name: npm ci
        run: npm ci

      - name: Typecheck completo
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm run test:unit

      - name: Build produtivo development
        env:
          VITE_APP_ENV: development
          VITE_CI_RUNTIME_SMOKE: "true"
          VITE_SUPABASE_URL: https://preview.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_runtime_smoke_only_not_for_deployment
        run: npm run build:dev

      - name: Rotas produtivas invariantes e preview ausente do build normal
        shell: bash
        run: |
          set -euo pipefail
          total=$(grep -o '<Route\b' src/App.tsx | wc -l | tr -d ' ')
          fallback=$(grep -o 'path="\*"' src/App.tsx | wc -l | tr -d ' ')
          explicit=$((total - fallback))
          test "$total" -eq 54
          test "$explicit" -eq 53
          test "$fallback" -eq 1
          test ! -e dist/visual-preview
          if grep -R -F "Preview integral — Aprendendo com DJ Stay" dist >/dev/null 2>&1; then
            echo "Preview contaminou o build produtivo."
            exit 1
          fi
          echo "ROUTES=54/53/1 INVARIANT"
          echo "PRODUCTIVE_BUILD_PREVIEW_FREE=PASS"

      - name: Build VISUAL_PREVIEW_ONLY com componentes reais
        env:
          VITE_APP_ENV: development
          VITE_CI_RUNTIME_SMOKE: "true"
          VITE_SUPABASE_URL: https://jmtyurketfclaneqxohu.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_runtime_smoke_only_not_for_deployment
        run: npx vite build --mode development --config visual-preview/vite.config.mjs

      - name: Materializar URLs profundas do preview
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { cp, mkdir } from "node:fs/promises";
          import { SURFACES } from "./visual-preview/surfaces.js";
          for (const surface of SURFACES) {
            const dir = `dist-visual-preview/visual-preview/${surface.slug}`;
            await mkdir(dir, { recursive: true });
            await cp("dist-visual-preview/index.html", `${dir}/index.html`);
          }
          console.log(`PREVIEW_SURFACES=${SURFACES.length}`);
          if (SURFACES.length !== 73) process.exit(1);
          NODE

      - name: Preparar servidor local
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-pages
          mkdir -p dist-pages/aprendendo-com-dj-stay
          cp -R dist-visual-preview/. dist-pages/aprendendo-com-dj-stay/
          python3 -m http.server 4173 --directory dist-pages >/tmp/visual-preview-http.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/aprendendo-com-dj-stay/visual-preview/public/home/ >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/visual-preview-http.log
          exit 1

      - name: Chrome smoke — 73 URLs desktop + mobile
        env:
          PREVIEW_BASE_URL: http://127.0.0.1:4173/aprendendo-com-dj-stay/
        run: node visual-preview/smoke.mjs

      - name: Chrome click-smoke — navegação real desktop + mobile
        env:
          PREVIEW_BASE_URL: http://127.0.0.1:4173/aprendendo-com-dj-stay/
          CLICK_SMOKE_DIAGNOSTICS_DIR: click-smoke-artifacts/local
        run: node visual-preview/click-smoke.mjs

      - name: Upload click-smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: click-smoke-diagnostics-${{ github.run_id }}
          path: click-smoke-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Confirmar isolamento do preview
        shell: bash
        run: |
          set -euo pipefail
          grep -R -F "VISUAL_PREVIEW_ONLY" visual-preview >/dev/null
          test -s dist-visual-preview/visual-preview/public/home/index.html
          test -s dist-visual-preview/visual-preview/admin/dashboard/index.html
          test -s dist-visual-preview/visual-preview/student/dashboard/index.html
          test -s dist-visual-preview/visual-preview/affiliate/active/index.html
          test -s dist-visual-preview/visual-preview/commerce/marketplace/index.html
          echo "PREVIEW_EXTERNAL_NETWORK_REQUIRED=NO"
          echo "PREVIEW_DEEP_URLS=73 PASS"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-visual-preview

  deploy:
    needs: validate-build-smoke
    runs-on: ubuntu-24.04
    environment:
      name: dev-visual-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verificar URL pública
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          url="$base/visual-preview/public/home/"
          for i in $(seq 1 30); do
            if curl -fsSL "$url" | grep -F "Preview integral" >/dev/null; then
              echo "PUBLIC_PREVIEW_URL=$base/visual-preview/public/home/"
              exit 0
            fi
            sleep 2
          done
          echo "URL pública não respondeu com o preview esperado."
          exit 1

      - name: Checkout somente para validar navegação pública
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 1

      - name: Node para click-smoke público
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0

      - name: Chrome click-smoke — URL pública real
        env:
          PREVIEW_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          CLICK_SMOKE_DIAGNOSTICS_DIR: click-smoke-artifacts/public
        run: node visual-preview/click-smoke.mjs

      - name: Upload public click-smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-click-smoke-diagnostics-${{ github.run_id }}
          path: click-smoke-artifacts
          if-no-files-found: ignore
          retention-days: 7
