name: Migração coordenada React Router 8

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/react-router-v8-upgrade.yml"

permissions:
  contents: write

concurrency:
  group: react-router-v8-upgrade-dev
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm

      - name: Aplicar migração coordenada
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-react-router-v8-upgrade.mjs")
          source = path.read_text()
          source = source.replace(
              'if (existsSync("scripts/apply-react-router-v8-upgrade.mjs")) failures.push("O helper temporário da migração deve ser removido.");',
              'if (existsSync("scripts/apply-react-router-v8-upgrade.mjs") && process.env.GITHUB_WORKFLOW !== "Migração coordenada React Router 8") failures.push("O helper temporário da migração deve ser removido.");',
          )
          source = source.replace(
              'rmSync("scripts/apply-react-router-v8-upgrade.mjs", { force: true });\n',
              '',
          )
          path.write_text(source)
          PY

          node scripts/apply-react-router-v8-upgrade.mjs
          node scripts/apply-react19-ui-compat.mjs
          rm -rf node_modules package-lock.json
          npm install --ignore-scripts --strict-peer-deps
          npm ci --ignore-scripts --strict-peer-deps

          if git grep -n "react-router-dom" -- "src/**" "package.json" "package-lock.json"; then
            echo "Referência legada react-router-dom permaneceu em código ou manifests." >&2
            exit 1
          fi

          if git grep -n "22.16.0" -- ".github/workflows/**" "package.json" "scripts/**"; then
            echo "Baseline Node 22.16.0 permaneceu em arquivos executáveis." >&2
            exit 1
          fi

      - name: Executar gate local consolidado
        run: npm run check

      - name: Persistir migração aprovada sem alterar workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-react-router-v8-upgrade.mjs
          rm -f scripts/apply-react19-ui-compat.mjs
          rm -f scripts/apply-react19-ui-compat.py
          git restore .github/workflows
          git config user.name "landersolucoestech-maker"
          git config user.email "landersolucoestech@gmail.com"
          git add -A
          git diff --cached --stat
          git commit -m "security(router): migrate declarative stack to v8.3.0"
          git push origin HEAD:dev

# publish only code and lockfile; workflow cleanup follows through the connector
