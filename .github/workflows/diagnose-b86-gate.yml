name: Diagnose B86 Gate

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/diagnose-b86-gate.yml

permissions:
  contents: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Reproduzir comandos
        id: checks
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          typecheck_code=$?
          npm run build > /tmp/build.log 2>&1
          build_code=$?
          echo "typecheck_code=$typecheck_code" >> "$GITHUB_OUTPUT"
          echo "build_code=$build_code" >> "$GITHUB_OUTPUT"
          tail -n 220 /tmp/typecheck.log > /tmp/typecheck-tail.log
          tail -n 220 /tmp/build.log > /tmp/build-tail.log
          exit 0

      - name: Publicar diagnóstico
        env:
          GH_TOKEN: ${{ github.token }}
          TYPECHECK_CODE: ${{ steps.checks.outputs.typecheck_code }}
          BUILD_CODE: ${{ steps.checks.outputs.build_code }}
        shell: bash
        run: |
          {
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Typecheck exit code: \`${TYPECHECK_CODE}\`"
            echo "Build exit code: \`${BUILD_CODE}\`"
            echo
            echo "## Typecheck"
            echo '```text'
            cat /tmp/typecheck-tail.log
            echo '```'
            echo
            echo "## Build"
            echo '```text'
            cat /tmp/build-tail.log
            echo '```'
          } > /tmp/body.md
          gh issue create --title "Diagnóstico gate B86 — ${GITHUB_SHA:0:12}" --body-file /tmp/body.md

      - name: Remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-b86-gate.yml
          git commit -m "chore(b86): remover diagnóstico temporário"
          git push origin HEAD:dev

# trigger: b86-gate-diagnostic
