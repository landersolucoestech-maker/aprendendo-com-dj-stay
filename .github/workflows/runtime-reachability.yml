name: Alcance do frontend

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-reachability-dev
  cancel-in-progress: true

jobs:
  reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm

      - name: Instalação limpa
        run: npm ci

      - name: Validar alcance dos módulos
        run: node scripts/check-runtime-reachability.mjs
