name: Integrar gate B81

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/patch-b81-package.yml"

permissions:
  contents: write

concurrency:
  group: patch-b81-package
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Integrar verificador B81
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "package.json";
          const packageJson = JSON.parse(fs.readFileSync(path, "utf8"));
          const scripts = packageJson.scripts ?? {};

          scripts["check:course-progress-tests"] =
            "node scripts/check-course-progress-tests.mjs";

          const marker = "npm run check:learning-progress-contract-tests";
          const command = "npm run check:course-progress-tests";
          if (typeof scripts.typecheck !== "string" || !scripts.typecheck.includes(marker)) {
            throw new Error("Marcador learning-progress não encontrado no typecheck.");
          }
          if (!scripts.typecheck.includes(command)) {
            scripts.typecheck = scripts.typecheck.replace(marker, `${marker} && ${command}`);
          }

          packageJson.scripts = scripts;
          fs.writeFileSync(path, `${JSON.stringify(packageJson, null, 2)}\n`, "utf8");
          NODE

      - name: Publicar integração e remover workflow temporário
        run: |
          rm .github/workflows/patch-b81-package.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json .github/workflows/patch-b81-package.yml
          git commit -m "test(b81): integrar progresso dos módulos ao typecheck"
          git push origin HEAD:dev
