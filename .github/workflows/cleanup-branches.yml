name: Limpar branches não autorizadas

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/cleanup-branches.yml"

permissions:
  contents: write

concurrency:
  group: cleanup-unauthorized-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: true

      - name: Remover todas as branches exceto main e dev
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git ls-remote --heads origin \
              | awk '{sub("refs/heads/", "", $2); print $2}' \
              | sort
          )

          for branch in "${branches[@]}"; do
            case "$branch" in
              main|dev)
                echo "Mantendo $branch"
                ;;
              *)
                echo "Removendo $branch"
                git push origin --delete "$branch"
                ;;
            esac
          done

          mapfile -t remaining < <(
            git ls-remote --heads origin \
              | awk '{sub("refs/heads/", "", $2); print $2}' \
              | sort
          )

          printf 'Branches restantes:\n'
          printf '%s\n' "${remaining[@]}"

          if [[ "${remaining[*]}" != "dev main" ]]; then
            echo "Estado final inválido: somente dev e main são permitidas." >&2
            exit 1
          fi
