name: B50 — Reconciliar evidências históricas

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/b50-reconcile-gate-evidence.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: b50-gate-evidence-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Reconciliar issues históricas
        uses: actions/github-script@v9
        with:
          script: |
            const githubApiHeaders = {
              accept: "application/vnd.github+json",
              "X-GitHub-Api-Version": "2026-03-10"
            };
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

            const listOpenIssues = async () => {
              const issues = [];
              let page = 1;

              while (true) {
                const response = await github.request("GET /repos/{owner}/{repo}/issues", {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: "open",
                  per_page: 100,
                  page,
                  headers: githubApiHeaders
                });

                issues.push(...response.data.filter((issue) => !issue.pull_request));

                if (response.data.length < 100) break;
                page += 1;
              }

              return issues;
            };

            const isGateEvidence = (issue) => issue.title.startsWith("Gate técnico —");
            const isGreenEvidence = (issue) => {
              const body = issue.body ?? "";
              const hasSuccess = /\bsuccess\b/i.test(body);
              const hasNonSuccess = /\b(failure|cancelled|skipped)\b/i.test(body);
              return isGateEvidence(issue) && hasSuccess && !hasNonSuccess;
            };

            const initial = await listOpenIssues();
            const initialOpenGate = initial.filter(isGateEvidence);
            const closedNumbers = new Set();
            let passes = 0;

            while (passes < 5) {
              passes += 1;
              const openIssues = await listOpenIssues();
              const greenCandidates = openIssues.filter(isGreenEvidence);

              if (greenCandidates.length === 0) break;

              for (const issue of greenCandidates) {
                await github.request("PATCH /repos/{owner}/{repo}/issues/{issue_number}", {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "completed",
                  headers: githubApiHeaders
                });
                closedNumbers.add(issue.number);
              }

              await sleep(3000);
            }

            await sleep(3000);

            const after = await listOpenIssues();
            const openGateAfter = after.filter(isGateEvidence);
            const remainingGreen = openGateAfter.filter(isGreenEvidence);
            const preservedNonGreen = openGateAfter.filter((issue) => !isGreenEvidence(issue));
            const reconciledNumbers = [...closedNumbers].sort((a, b) => a - b);
            const closedRange = reconciledNumbers.length > 0
              ? `#${reconciledNumbers[0]} a #${reconciledNumbers[reconciledNumbers.length - 1]}`
              : "nenhuma";

            const report = [
              "B50 executada pelo workflow temporário de reconciliação histórica.",
              "",
              `- Evidências de gate abertas no início desta execução: ${initialOpenGate.length}`,
              `- Evidências verdes encerradas nesta execução: ${reconciledNumbers.length}`,
              `- Evidências não verdes preservadas: ${preservedNonGreen.length}`,
              `- Evidências verdes restantes: ${remainingGreen.length}`,
              `- Passadas executadas: ${passes}`,
              `- Intervalo numérico das evidências encerradas: ${closedRange}`,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join("\n");

            await core.summary
              .addHeading("B50 — Reconciliação histórica")
              .addRaw(report)
              .write();

            await github.request("POST /repos/{owner}/{repo}/issues/{issue_number}/comments", {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 411,
              body: report,
              headers: githubApiHeaders
            });

            if (remainingGreen.length > 0) {
              core.setFailed(
                `Reconciliação incompleta: ${remainingGreen.length} evidência(s) verde(s) ainda estão abertas.`
              );
            }
