name: Diagnosticar gate final B79

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/diagnose-b79-gate-final.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: diagnose-b79-gate-final
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Localizar lógica do gate final
        run: |
          set -euo pipefail
          {
            echo "WORKFLOWS"
            find .github/workflows -maxdepth 1 -type f -print | sort
            echo
            echo "ARQUIVOS COM GATE FINAL"
            grep -R -n -l "Gate final" .github/workflows || true
            echo
            echo "CONTEXTO GATE FINAL"
            while IFS= read -r file; do
              echo "===== $file ====="
              line="$(grep -n -m1 "Gate final" "$file" | cut -d: -f1 || true)"
              if [ -n "$line" ]; then
                start=$(( line > 80 ? line - 80 : 1 ))
                end=$(( line + 80 ))
                sed -n "${start},${end}p" "$file"
              fi
            done < <(grep -R -l "Gate final" .github/workflows || true)
            echo
            echo "REFERÊNCIAS TYPESCRIPT/TYPECHECK"
            grep -R -n -E "TypeScript|typescript|Typecheck|typecheck|steps\..*outcome|steps\..*conclusion" .github/workflows || true
          } > /tmp/b79-gate-final.txt

      - name: Publicar diagnóstico
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("node:fs");
            const raw = fs.readFileSync("/tmp/b79-gate-final.txt", "utf8");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Diagnóstico gate final B79 — ${context.sha.slice(0, 12)}`,
              body: [
                `Commit: \`${context.sha}\``,
                "",
                "```yaml",
                raw.slice(-30000),
                "```",
              ].join("\n"),
            });

      - name: Remover workflow temporário
        run: |
          rm .github/workflows/diagnose-b79-gate-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/diagnose-b79-gate-final.yml
          git commit -m "chore(b79): remover diagnóstico do gate final"
          git push origin HEAD:dev
