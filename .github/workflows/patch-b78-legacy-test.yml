name: Corrigir fixture legado B78

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/patch-b78-legacy-test.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Atualizar somente o fixture positivo do YouTube
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/contracts/curriculum-cms.test.ts")
          content = path.read_text(encoding="utf-8")
          old = 'external_video_id: "video-123",'
          new = 'external_video_id: "AbCdEf123_-",'
          if old not in content:
              raise SystemExit("Fixture legado positivo não encontrado.")
          content = content.replace(old, new, 1)
          path.write_text(content, encoding="utf-8")
          PY

      - name: Publicar correção e remover workflow temporário
        run: |
          rm .github/workflows/patch-b78-legacy-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/contracts/curriculum-cms.test.ts .github/workflows/patch-b78-legacy-test.yml
          git commit -m "test(b78): alinhar fixture legado do YouTube"
          git push origin HEAD:dev
