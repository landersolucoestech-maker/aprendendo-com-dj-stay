name: Diagnose B85 Typecheck

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/diagnose-b85-typecheck.yml

permissions:
  contents: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar typecheck e capturar saída
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/b85-typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 180 /tmp/b85-typecheck.log > /tmp/b85-tail.log
          exit 0

      - name: Publicar diagnóstico
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.typecheck.outputs.exit_code }}
        shell: bash
        run: |
          {
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Exit code: \`${EXIT_CODE}\`"
            echo
            echo '```text'
            cat /tmp/b85-tail.log
            echo '```'
          } > /tmp/body.md
          gh issue create --title "Diagnóstico typecheck B85 — ${GITHUB_SHA:0:12}" --body-file /tmp/body.md

      - name: Remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-b85-typecheck.yml
          git commit -m "chore(b85): remover diagnóstico temporário"
          git push origin HEAD:dev
