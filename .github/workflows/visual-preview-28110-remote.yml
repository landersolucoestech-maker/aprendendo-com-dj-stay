name: Visual Preview 28.1.10 — Remote Candidate Executor

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/visual-preview-28110-remote.yml"
      - "scripts/run-28110-focused-profile.mjs"

permissions:
  contents: write
  actions: write

concurrency:
  group: visual-preview-28110-remote-dev
  cancel-in-progress: false

env:
  BASE_FUNCTIONAL_HEAD: 828191f0aca2d935a883610b50bcd4908319a254
  EXPECTED_MAIN_HEAD: b3a303caff9a19f231616b2b4d9fc65c2d8a557d
  BASELINE_CLICK_SMOKE_BLOB: 6344163028641bcda2aca9901eb5906daa843804
  CANDIDATE_BLOB: 12c9cd148a3167a33cdd89763185d880f4fec9ab

jobs:
  validate-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout dev integral
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Node 22.22.0
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm

      - name: Preconditions e boundary do control-plane
        id: preconditions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/28110
          git fetch --prune origin dev main
          current="$(git rev-parse HEAD)"
          remote_dev="$(git rev-parse origin/dev)"
          main="$(git rev-parse origin/main)"
          test "$(git branch --show-current)" = "dev"
          test "$current" = "$remote_dev"
          test "$main" = "$EXPECTED_MAIN_HEAD"
          git merge-base --is-ancestor "$BASE_FUNCTIONAL_HEAD" HEAD
          mapfile -t cp_files < <(git diff --name-only "$BASE_FUNCTIONAL_HEAD"..HEAD | sort)
          printf '%s\n' "${cp_files[@]}" | tee artifacts/28110/control-plane-files.txt
          test "${#cp_files[@]}" -eq 2
          test "${cp_files[0]}" = ".github/workflows/visual-preview-28110-remote.yml"
          test "${cp_files[1]}" = "scripts/run-28110-focused-profile.mjs"
          test "$(git hash-object visual-preview/click-smoke.mjs)" = "$BASELINE_CLICK_SMOKE_BLOB"
          if git rev-list --objects --all | grep -q "^$CANDIDATE_BLOB "; then
            echo "CANDIDATE_BLOB_REFERENCED=true"
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo "BASE_HEAD=$BASE_FUNCTIONAL_HEAD" | tee artifacts/28110/preconditions.txt
          echo "CURRENT_HEAD=$current" | tee -a artifacts/28110/preconditions.txt
          echo "MAIN_HEAD=$main" | tee -a artifacts/28110/preconditions.txt
          echo "BRANCH=$(git branch --show-current)" | tee -a artifacts/28110/preconditions.txt
          echo "NODE=$(node --version)" | tee -a artifacts/28110/preconditions.txt
          echo "NPM=$(npm --version)" | tee -a artifacts/28110/preconditions.txt
          echo "TRACKED_FILES=$(git ls-files | wc -l | tr -d ' ')" | tee -a artifacts/28110/preconditions.txt
          echo "CONTROL_PLANE_BOUNDARY=PASS" | tee -a artifacts/28110/preconditions.txt
          echo "CANDIDATE_BLOB_REFERENCED=false" | tee -a artifacts/28110/preconditions.txt
          echo "control_head=$current" >> "$GITHUB_OUTPUT"

      - name: Materializar, corrigir sintaxe e validar semanticamente o candidate órfão
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${CANDIDATE_BLOB}" --jq '.content' | tr -d '\n' | base64 --decode > /tmp/candidate-click-smoke.mjs
          test "$(git hash-object /tmp/candidate-click-smoke.mjs)" = "$CANDIDATE_BLOB"
          echo 'SYNTAX_ERROR_FILE=visual-preview/click-smoke.mjs' | tee artifacts/28110/candidate-syntax.txt
          echo 'SYNTAX_ERROR_LINE=697' | tee -a artifacts/28110/candidate-syntax.txt
          echo 'SYNTAX_ERROR_SOURCE=throw new Error( TARGET_VISIBLE_ABOVE_ACCOUNT_CARD=false: ${JSON.stringify(target)}`);' | tee -a artifacts/28110/candidate-syntax.txt
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/candidate-click-smoke.mjs')
          text = path.read_text()
          first_bad = 'throw new Error( TARGET_VISIBLE_ABOVE_ACCOUNT_CARD=false: ${JSON.stringify(target)}`);'
          first_good = 'throw new Error(`TARGET_VISIBLE_ABOVE_ACCOUNT_CARD=false: ${JSON.stringify(target)}`);'
          first_count = text.count(first_bad)
          if first_count != 1:
              raise SystemExit(f'Expected exactly one first malformed expression, found {first_count}')
          text = text.replace(first_bad, first_good, 1)
          second_bad = 'throw new Error((TRUSTED_CLICK=false: ${JSON.stringify(target)}`);'
          second_good = 'throw new Error(`TRUSTED_CLICK=false: ${JSON.stringify(target)}`);'
          second_count = text.count(second_bad)
          print(f'SECOND_SYNTAX_ERROR_MATCH_COUNT={second_count}')
          if second_count != 1:
              raise SystemExit(f'Expected exactly one second malformed expression, found {second_count}')
          text = text.replace(second_bad, second_good, 1)
          path.write_text(text)
          PY
          grep -F 'throw new Error(`TARGET_VISIBLE_ABOVE_ACCOUNT_CARD=false: ${JSON.stringify(target)}`);' /tmp/candidate-click-smoke.mjs >/dev/null
          grep -F 'throw new Error(`TRUSTED_CLICK=false: ${JSON.stringify(target)}`);' /tmp/candidate-click-smoke.mjs >/dev/null
          echo 'FIRST_SYNTAX_FIX=template literal corrigido exclusivamente' | tee -a artifacts/28110/candidate-syntax.txt
          echo 'SECOND_SYNTAX_ERROR_LINE=700' | tee -a artifacts/28110/candidate-syntax.txt
          echo 'SECOND_SYNTAX_FIX=template literal corrigido exclusivamente' | tee -a artifacts/28110/candidate-syntax.txt
          echo 'SECOND_SYNTAX_ERROR_MATCH_COUNT=1' | tee -a artifacts/28110/candidate-syntax.txt
          grep -F 'point!==document.documentElement' /tmp/candidate-click-smoke.mjs >/dev/null
          grep -F 'point!==document.body' /tmp/candidate-click-smoke.mjs >/dev/null
          grep -F 'blocker!==scrollable' /tmp/candidate-click-smoke.mjs >/dev/null
          grep -F '!blocker.contains(el)' /tmp/candidate-click-smoke.mjs >/dev/null
          grep -F "bs.pointerEvents!=='none'" /tmp/candidate-click-smoke.mjs >/dev/null
          grep -F 'intersectsTarget&&canIntercept' /tmp/candidate-click-smoke.mjs >/dev/null
          grep -F 'localBlockerCandidates' /tmp/candidate-click-smoke.mjs >/dev/null
          cmp -s visual-preview/click-smoke.mjs /tmp/candidate-click-smoke.mjs && { echo 'Candidate não difere do baseline'; exit 1; }
          cp /tmp/candidate-click-smoke.mjs visual-preview/click-smoke.mjs
          changed="$(git diff --name-only)"
          test "$changed" = "visual-preview/click-smoke.mjs"
          echo "CANDIDATE_PATCH=SEMANTICALLY_VERIFIED" | tee artifacts/28110/candidate.txt
          echo "FILES_CHANGED=$changed" | tee -a artifacts/28110/candidate.txt

      - name: Node check e patch boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check visual-preview/click-smoke.mjs
          test "$(git diff --name-only)" = "visual-preview/click-smoke.mjs"
          echo "HTML_EXCLUDED_AS_BLOCKER=true" | tee artifacts/28110/static-validation.txt
          echo "BODY_EXCLUDED_AS_BLOCKER=true" | tee -a artifacts/28110/static-validation.txt
          echo "DOCUMENT_ROOT_EXCLUDED=true" | tee -a artifacts/28110/static-validation.txt
          echo "SCROLL_OWNER_EXCLUDED=true" | tee -a artifacts/28110/static-validation.txt
          echo "PATCH_BOUNDARY=PASS" | tee -a artifacts/28110/static-validation.txt
          echo "NODE_CHECK=PASS" | tee -a artifacts/28110/static-validation.txt

      - name: npm ci
        run: npm ci

      - name: Build VISUAL_PREVIEW_ONLY para validação runtime
        env:
          VITE_APP_ENV: development
          VITE_CI_RUNTIME_SMOKE: "true"
          VITE_SUPABASE_URL: https://jmtyurketfclaneqxohu.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_runtime_smoke_only_not_for_deployment
        run: npx vite build --mode development --config visual-preview/vite.config.mjs

      - name: Materializar 73 deep links e iniciar servidor local
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { cp, mkdir } from "node:fs/promises";
          import { SURFACES } from "./visual-preview/surfaces.js";
          if (SURFACES.length !== 73) process.exit(1);
          for (const surface of SURFACES) {
            const dir = `dist-visual-preview/visual-preview/${surface.slug}`;
            await mkdir(dir, { recursive: true });
            await cp("dist-visual-preview/index.html", `${dir}/index.html`);
          }
          console.log(`PREVIEW_SURFACES=${SURFACES.length}`);
          NODE
          rm -rf dist-pages
          mkdir -p dist-pages/aprendendo-com-dj-stay
          cp -R dist-visual-preview/. dist-pages/aprendendo-com-dj-stay/
          python3 -m http.server 4173 --directory dist-pages >artifacts/28110/http.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/aprendendo-com-dj-stay/visual-preview/student/history/ >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat artifacts/28110/http.log
          exit 1

      - name: Focused Student mobile Profile primeiro
        env:
          PREVIEW_BASE_URL: http://127.0.0.1:4173/aprendendo-com-dj-stay/
          CLICK_SMOKE_DIAGNOSTICS_DIR: artifacts/28110/focused-profile-diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-28110-focused-profile.mjs 2>&1 | tee artifacts/28110/focused-profile.log
          grep -F 'FOCUSED_STUDENT_MOBILE_PROFILE_TEST=PASS' artifacts/28110/focused-profile.log >/dev/null

      - name: Focused regressions + mobile + desktop completos
        env:
          PREVIEW_BASE_URL: http://127.0.0.1:4173/aprendendo-com-dj-stay/
          CLICK_SMOKE_DIAGNOSTICS_DIR: artifacts/28110/full-click-diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node visual-preview/click-smoke.mjs 2>&1 | tee artifacts/28110/full-click-smoke.log
          grep -F 'FOCUSED_STUDENT_MOBILE_NOTIFICATIONS_TEST=PASS' artifacts/28110/full-click-smoke.log >/dev/null
          grep -F 'FOCUSED_PUBLIC_MOBILE_CONTACT_REGRESSION=PASS' artifacts/28110/full-click-smoke.log >/dev/null
          grep -F 'FOCUSED_PUBLIC_MOBILE_COURSES_TEST=PASS' artifacts/28110/full-click-smoke.log >/dev/null
          grep -F 'FOCUSED_STUDENT_PROFILE_EDIT_REGRESSION=PASS' artifacts/28110/full-click-smoke.log >/dev/null
          grep -F 'FOCUSED_STUDENT_HISTORY_REGRESSION=PASS' artifacts/28110/full-click-smoke.log >/dev/null
          grep -F 'FOCUSED_COMMERCIAL_TEST=PASS' artifacts/28110/full-click-smoke.log >/dev/null
          grep -F 'CLICK_SMOKE_MOBILE=PASS' artifacts/28110/full-click-smoke.log >/dev/null
          grep -F 'CLICK_SMOKE_DESKTOP=PASS' artifacts/28110/full-click-smoke.log >/dev/null
          grep -F 'BROWSER_BACK_FORWARD_ALL_AREAS=PASS' artifacts/28110/full-click-smoke.log >/dev/null
          grep -F 'PREVIEW_CLICK_SMOKE=PASS' artifacts/28110/full-click-smoke.log >/dev/null
          echo "RUNTIME_CLICK_SMOKE=PASS" | tee artifacts/28110/runtime-summary.txt

      - name: Typecheck completo
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee artifacts/28110/typecheck.log

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee artifacts/28110/lint.log

      - name: Testes unitários
        shell: bash
        env:
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          npm run test:unit 2>&1 | tee artifacts/28110/tests.log
          grep -E 'Test Files[[:space:]]+57 passed.*\(57\)' artifacts/28110/tests.log >/dev/null
          grep -E 'Tests[[:space:]]+804 passed.*\(804\)' artifacts/28110/tests.log >/dev/null

      - name: Build produtivo development
        env:
          VITE_APP_ENV: development
          VITE_CI_RUNTIME_SMOKE: "true"
          VITE_SUPABASE_URL: https://preview.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_runtime_smoke_only_not_for_deployment
        shell: bash
        run: |
          set -euo pipefail
          npm run build:dev 2>&1 | tee artifacts/28110/build.log

      - name: Rotas e 146 renders isolados
        env:
          PREVIEW_BASE_URL: http://127.0.0.1:4173/aprendendo-com-dj-stay/
        shell: bash
        run: |
          set -euo pipefail
          total=$(grep -o '<Route\b' src/App.tsx | wc -l | tr -d ' ')
          fallback=$(grep -o 'path="\*"' src/App.tsx | wc -l | tr -d ' ')
          explicit=$((total - fallback))
          test "$total" -eq 54
          test "$explicit" -eq 53
          test "$fallback" -eq 1
          echo "ROUTES=54/53/1 INVARIANT" | tee artifacts/28110/routes.txt
          node visual-preview/smoke.mjs 2>&1 | tee artifacts/28110/render-smoke.log
          grep -F 'PREVIEW_SMOKE_TOTAL=146 PASS' artifacts/28110/render-smoke.log >/dev/null
          grep -R -F 'VISUAL_PREVIEW_ONLY' visual-preview >/dev/null
          echo "DEEP_LINKS=73/73 PASS" | tee artifacts/28110/isolation.txt
          echo "RENDERS=146/146 PASS" | tee -a artifacts/28110/isolation.txt
          echo "PREVIEW_EXTERNAL_NETWORK_REQUIRED=NO" | tee -a artifacts/28110/isolation.txt

      - name: Worktree candidate boundary e concurrency
        id: concurrency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "visual-preview/click-smoke.mjs"
          test -z "$(git diff --cached --name-only)"
          git fetch origin dev main
          control_head='${{ steps.preconditions.outputs.control_head }}'
          test "$(git rev-parse origin/dev)" = "$control_head" || { echo 'CONCURRENT_DEV_UPDATE' | tee artifacts/28110/concurrency.txt; exit 1; }
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_HEAD"
          echo "WORKTREE=CANDIDATE_ONLY" | tee artifacts/28110/concurrency.txt
          echo "CONCURRENT_UPDATE=NO" | tee -a artifacts/28110/concurrency.txt

      - name: Commit funcional e push fast-forward dev
        id: feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- visual-preview/click-smoke.mjs
          test "$(git diff --cached --name-only)" = "visual-preview/click-smoke.mjs"
          git commit -m "fix(preview): ignore structural roots as click blockers"
          feature_head="$(git rev-parse HEAD)"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "visual-preview/click-smoke.mjs"
          git push origin HEAD:dev
          git fetch origin dev main
          test "$(git rev-parse origin/dev)" = "$feature_head"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_HEAD"
          echo "$feature_head" | tee artifacts/28110/feature-head.txt
          echo "feature_head=$feature_head" >> "$GITHUB_OUTPUT"
          echo "PUSH_DEV=PASS"
          echo "MAIN_ALTERADA=NAO"

      - name: Disparar workflow oficial do novo HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run visual-preview.yml --ref dev
          echo "OFFICIAL_NEW_HEAD_WORKFLOW_DISPATCHED=true" | tee artifacts/28110/dispatch.txt

      - name: Upload artifact 28.1.10-C
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-preview-28110-remote-${{ github.run_id }}
          path: artifacts/28110
          if-no-files-found: warn
          retention-days: 7
