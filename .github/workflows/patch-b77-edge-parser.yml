name: Aplicar parser runtime B77

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/patch-b77-edge-parser.yml"

permissions:
  contents: write

concurrency:
  group: patch-b77-edge-parser
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Integrar parser puro ao gateway
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("supabase/functions/media-playback/index.ts")
          content = path.read_text(encoding="utf-8")

          content = content.replace(
              'import { createClient } from "npm:@supabase/supabase-js@2";\n\ninterface PlaybackResolution {\n  granted: boolean;\n  reason: string | null;\n  provider: "private_asset" | "youtube" | "vimeo" | null;\n  bucket_id: string | null;\n  object_path: string | null;\n  embed_url: string | null;\n  mime_type: string | null;\n  watermark_text: string | null;\n  expires_at: string | null;\n}\n',
              'import { createClient } from "npm:@supabase/supabase-js@2";\n\nimport { parsePlaybackResolution } from "../_shared/playback-contract.ts";\n',
              1,
          )

          old = '    const resolution = (Array.isArray(data) ? data[0] : data) as PlaybackResolution | undefined;\n    if (!resolution?.granted || !resolution.provider || !resolution.expires_at) {'
          new = '    const resolution = parsePlaybackResolution(Array.isArray(data) ? data[0] : data);\n    if (!resolution) {\n      console.error("Playback resolver returned an invalid contract");\n      return jsonResponse({ error: "PLAYBACK_RESOLUTION_FAILED" }, 502, requestOrigin);\n    }\n\n    if (!resolution.granted || !resolution.provider || !resolution.expires_at) {'
          if old not in content:
              raise SystemExit("Bloco de cast da resolução não encontrado.")
          content = content.replace(old, new, 1)

          if "as PlaybackResolution" in content:
              raise SystemExit("Cast não validado ainda presente.")

          path.write_text(content, encoding="utf-8")
          PY

      - name: Publicar alteração e remover workflow temporário
        run: |
          rm .github/workflows/patch-b77-edge-parser.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            supabase/functions/media-playback/index.ts \
            .github/workflows/patch-b77-edge-parser.yml
          git commit -m "feat(b77): validar resolução de playback na edge"
          git push origin HEAD:dev
