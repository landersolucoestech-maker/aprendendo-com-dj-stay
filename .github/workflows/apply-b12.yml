name: Aplicar pacote B12

on:
  push:
    branches: [dev]
    paths:
      - "scripts/b12/apply.trigger"

permissions:
  contents: write

concurrency:
  group: apply-b12-dev
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validar, aplicar e limpar pacote
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/b12/payload.b64
          base64 --decode scripts/b12/payload.b64 > /tmp/b12-ui-payload.tar.gz
          echo "926af29257d1ff9467b13eb8ef1c8f65202835cded9787236082f79ab462fd35  /tmp/b12-ui-payload.tar.gz" | sha256sum -c -
          gzip -t /tmp/b12-ui-payload.tar.gz
          test "$(tar -tzf /tmp/b12-ui-payload.tar.gz | wc -l)" -eq 23
          tar -tzf /tmp/b12-ui-payload.tar.gz | grep -Fx 'src/pages/admin/CourseCurriculum.tsx'
          tar -tzf /tmp/b12-ui-payload.tar.gz | grep -Fx 'src/components/admin/CurriculumEditorDialogs.tsx'
          tar -tzf /tmp/b12-ui-payload.tar.gz | grep -Fx '.github/workflows/baseline.yml'
          if tar -tzf /tmp/b12-ui-payload.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Pacote contém caminho inseguro." >&2
            exit 1
          fi

          tar -xzf /tmp/b12-ui-payload.tar.gz
          rm -rf scripts/b12
          rm -f .github/workflows/apply-b12.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(b12): complete modules and lessons administration"
          git push origin HEAD:dev
