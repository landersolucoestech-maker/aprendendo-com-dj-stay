name: Patch B86 Package

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-b86-package.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Integrar contrato B86
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("package.json")
          package = json.loads(path.read_text(encoding="utf-8"))
          scripts = package["scripts"]
          scripts["check:student-frame-consumers"] = "node scripts/check-student-frame-consumers.mjs"
          old_chain = "npm run check:student-profile-editor && npm run check:player-progress"
          new_chain = "npm run check:student-profile-editor && npm run check:student-frame-consumers && npm run check:player-progress"
          if new_chain not in scripts["typecheck"]:
              if old_chain not in scripts["typecheck"]:
                  raise SystemExit("Ordem B85/player não encontrada")
              scripts["typecheck"] = scripts["typecheck"].replace(old_chain, new_chain, 1)
          path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Remover workflow temporário
        run: rm .github/workflows/patch-b86-package.yml

      - name: Publicar integração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .github/workflows/patch-b86-package.yml
          git diff --cached --quiet && exit 0
          git commit -m "test(b86): integrar consumidores do frame ao typecheck"
          git push origin HEAD:dev
