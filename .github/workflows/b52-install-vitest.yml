name: B52 — Instalar Vitest

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/b52-install-vitest.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: b52-install-vitest
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev

      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm

      - name: Gerar package.json e package-lock.json
        run: |
          npm install --package-lock-only --save-dev --save-exact --ignore-scripts --no-audit --no-fund vitest@4.1.10
          node -e "const p=require('./package.json'); if(p.devDependencies.vitest!=='4.1.10') process.exit(1)"
          node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/vitest'].version!=='4.1.10') process.exit(1)"
          git diff --check
          git diff --exit-code -- . ':!package.json' ':!package-lock.json'

      - name: Persistir dependência fixada
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Vitest já estava sincronizado."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "build(b52): fixar Vitest 4.1.10 [skip ci]"
          git push origin HEAD:dev

      - name: Registrar evidência
        uses: actions/github-script@v9
        with:
          script: |
            await github.request("POST /repos/{owner}/{repo}/issues/{issue_number}/comments", {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 419,
              body: [
                "Vitest `4.1.10` foi resolvido pelo npm no runner oficial.",
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "`package.json` e `package-lock.json` foram validados antes do commit automático."
              ].join("\n"),
              headers: {
                accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2026-03-10"
              }
            });
