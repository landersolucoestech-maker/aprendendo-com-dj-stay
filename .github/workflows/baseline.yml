# Pacote B10 completo: blocos 00–06 presentes e verificados por SHA integral.
name: Gate técnico
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths-ignore: ["docs/**"]
permissions:
  contents: write
  issues: write
concurrency:
  group: gate-dev
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar pacote B10
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t chunks < <(find scripts/b10-payload -maxdepth 1 -type f -name 'block-*.b64' | sort)
          test "${#chunks[@]}" -eq 7
          cat "${chunks[@]}" | base64 --decode > /tmp/b10.tar.gz
          echo "c667cd0215320a6ebdd3f31728cbac26b3a3425a702040a1cf616af1d4073520  /tmp/b10.tar.gz" | sha256sum -c -
          gzip -t /tmp/b10.tar.gz
          tar -tzf /tmp/b10.tar.gz | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          package.json
          scripts/check-course-access-contract.mjs
          scripts/check-data-contracts.mjs
          scripts/check-environment-contract.mjs
          src/App.tsx
          src/components/VideoPlayer.tsx
          src/contracts/course-access.ts
          src/contracts/learning.ts
          src/contracts/playback.ts
          src/hooks/useCourseAccess.ts
          src/hooks/useLessonPlayback.ts
          src/hooks/useLessons.ts
          src/hooks/useModules.ts
          src/integrations/supabase/types.ts
          src/lib/playback-fingerprint.ts
          src/pages/Dashboard.tsx
          src/pages/PaymentSuccess.tsx
          supabase/config.toml
          supabase/functions/media-playback/deno.json
          supabase/functions/media-playback/index.ts
          supabase/migrations/20260730200200_course_content_access.sql
          supabase/migrations/20260730200300_lesson_media.sql
          supabase/migrations/20260730200400_playback_schema.sql
          supabase/migrations/20260730200500_playback_rpcs.sql
          supabase/migrations/20260730200600_fix_playback_token_ambiguity.sql
          supabase/migrations/20260730200700_harden_playback_issue_pgcrypto.sql
          supabase/migrations/20260730200800_harden_playback_resolution_pgcrypto.sql
          supabase/tests/00_canonical_schema.test.sql
          supabase/tests/01_roles_schema.test.sql
          supabase/tests/02_roles_student.test.sql
          supabase/tests/03_roles_affiliate_anonymous.test.sql
          supabase/tests/04_roles_admin.test.sql
          supabase/tests/05_storage_schema.test.sql
          supabase/tests/06_storage_avatar.test.sql
          supabase/tests/07_storage_lesson_grants.test.sql
          supabase/tests/09_course_access_schema.test.sql
          supabase/tests/10_enrollment_lifecycle.test.sql
          supabase/tests/11_course_content_rls.test.sql
          supabase/tests/12_lesson_media_playback.test.sql
          EOF
          sed -i 's/^          //' /tmp/expected
          diff -u /tmp/expected /tmp/actual
          ! grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/actual
          tar -xzf /tmp/b10.tar.gz -C .
          rm -rf scripts/b10-payload
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json scripts src supabase
          git commit -m "feat(b10): complete protected course playback [skip ci]"
          git push origin HEAD:dev
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Instalação limpa
        run: npm ci
      - name: Lint
        run: npm run lint
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Reconstruir e testar banco
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
          supabase db reset --local --no-seed
          supabase test db
          mkdir -p artifacts
          supabase gen types typescript --local > artifacts/database.types.ts
          cp artifacts/database.types.ts src/integrations/supabase/types.ts
          if ! git diff --quiet -- src/integrations/supabase/types.ts; then
            git add src/integrations/supabase/types.ts
            git commit -m "chore(b10): synchronize generated database types [skip ci]"
            git push origin HEAD:dev
          fi
          diff -u src/integrations/supabase/types.ts artifacts/database.types.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        env:
          VITE_APP_ENV: development
          VITE_SUPABASE_URL: https://jmtyurketfclaneqxohu.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
        run: npm run build:dev
      - name: Evidência
        if: always()
        uses: actions/github-script@v7
        env:
          APPLIED_SHA: ${{ steps.apply.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const appliedSha = process.env.APPLIED_SHA || context.sha;
            const jobStatus = process.env.JOB_STATUS || 'unknown';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Gate técnico — ${context.sha.slice(0,12)}`,
              body: `Commit controlador: \`${context.sha}\`\nCommit funcional: \`${appliedSha}\`\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nConclusão: **${jobStatus}**`
            });
