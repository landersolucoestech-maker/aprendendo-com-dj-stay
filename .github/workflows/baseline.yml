# Gate controlado das fases de fundação. Não contém deploy.
name: Baseline técnico

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths-ignore:
      - "docs/**"

permissions:
  contents: write
  issues: write

concurrency:
  group: baseline-dev
  cancel-in-progress: false

jobs:
  baseline:
    name: Instalação, lint, typecheck e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capturar metadados Git de entrada
        id: gitmeta
        run: echo "tree_sha=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Aplicar lote de correções da fase
        id: phase_apply
        continue-on-error: true
        run: |
          shopt -s nullglob
          patches=(scripts/b3/*.patch)

          if [ ${#patches[@]} -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for patch in "${patches[@]}"; do
            git apply --check "$patch"
          done

          for patch in "${patches[@]}"; do
            git apply "$patch"
          done

          rm -rf scripts/b3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(b3): resolve lint and typing baseline"
          git push origin HEAD:dev
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configurar Node.js
        if: steps.phase_apply.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Sincronizar package-lock.json
        id: lock_sync
        if: steps.phase_apply.outcome == 'success'
        continue-on-error: true
        run: npm install --package-lock-only --ignore-scripts

      - name: Persistir lockfile sincronizado
        id: lock_commit
        if: steps.lock_sync.outcome == 'success'
        continue-on-error: true
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync npm lockfile"
          git push origin HEAD:dev
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Instalação limpa
        id: install
        if: steps.lock_sync.outcome == 'success' && steps.lock_commit.outcome == 'success'
        continue-on-error: true
        run: npm ci

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Exportar snapshot integral do código-fonte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ steps.lock_commit.outputs.commit_sha || steps.phase_apply.outputs.commit_sha || github.sha }}
          path: |
            .
            !.git/**
            !node_modules/**
            !dist/**
          include-hidden-files: true
          retention-days: 1

      - name: Registrar evidência do gate
        if: always()
        uses: actions/github-script@v7
        env:
          TREE_SHA: ${{ steps.gitmeta.outputs.tree_sha }}
          VALIDATED_SHA: ${{ steps.lock_commit.outputs.commit_sha || steps.phase_apply.outputs.commit_sha || github.sha }}
          PHASE_APPLY_OUTCOME: ${{ steps.phase_apply.outcome }}
          PHASE_CHANGED: ${{ steps.phase_apply.outputs.changed }}
          LOCK_SYNC_OUTCOME: ${{ steps.lock_sync.outcome }}
          LOCK_COMMIT_OUTCOME: ${{ steps.lock_commit.outcome }}
          LOCK_CHANGED: ${{ steps.lock_commit.outputs.changed }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const shortSha = process.env.VALIDATED_SHA.slice(0, 12);
            const title = `Gate técnico — ${shortSha}`;
            const body = [
              '## Evidência automática do gate técnico',
              '',
              `- Commit disparador: \`${context.sha}\``,
              `- Commit validado: \`${process.env.VALIDATED_SHA}\``,
              `- Tree SHA de entrada: \`${process.env.TREE_SHA}\``,
              `- Branch: \`${context.ref.replace('refs/heads/', '')}\``,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '| Etapa | Resultado |',
              '| --- | --- |',
              `| aplicar lote da fase | ${process.env.PHASE_APPLY_OUTCOME} |`,
              `| árvore alterada | ${process.env.PHASE_CHANGED || 'false'} |`,
              `| sincronizar lockfile | ${process.env.LOCK_SYNC_OUTCOME || 'skipped'} |`,
              `| persistir lockfile | ${process.env.LOCK_COMMIT_OUTCOME || 'skipped'} |`,
              `| lockfile alterado | ${process.env.LOCK_CHANGED || 'false'} |`,
              `| npm ci | ${process.env.INSTALL_OUTCOME || 'skipped'} |`,
              `| npm run lint | ${process.env.LINT_OUTCOME || 'skipped'} |`,
              `| npm run typecheck | ${process.env.TYPECHECK_OUTCOME || 'skipped'} |`,
              `| npm run build | ${process.env.BUILD_OUTCOME || 'skipped'} |`,
              '',
              'Esta issue é evidência técnica automática. Não representa aprovação de produção.'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });

      - name: Aplicar gate final
        if: always()
        env:
          PHASE_APPLY_OUTCOME: ${{ steps.phase_apply.outcome }}
          LOCK_SYNC_OUTCOME: ${{ steps.lock_sync.outcome }}
          LOCK_COMMIT_OUTCOME: ${{ steps.lock_commit.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          test "$PHASE_APPLY_OUTCOME" = "success"
          test "$LOCK_SYNC_OUTCOME" = "success"
          test "$LOCK_COMMIT_OUTCOME" = "success"
          test "$INSTALL_OUTCOME" = "success"
          test "$LINT_OUTCOME" = "success"
          test "$TYPECHECK_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
