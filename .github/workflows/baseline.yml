name: Gate técnico

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths-ignore: ["docs/**"]

permissions:
  contents: write
  issues: write

concurrency:
  group: gate-dev
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_CLI_VERSION: 2.111.0

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm

      - name: Instalação limpa
        id: install
        continue-on-error: true
        run: npm ci

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: Testes unitários
        id: unit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test:unit

      - name: Configurar Supabase CLI
        id: cli
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" --version

      - name: Reconstruir banco e executar pgTAP
        id: db
        if: steps.cli.outcome == 'success'
        continue-on-error: true
        run: |
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --no-backup || true
          set -o pipefail
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor 2>&1 | node scripts/redact-supabase-cli-output.mjs
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db reset --local --no-seed
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" test db

      - name: Gerar e sincronizar tipos
        id: types
        if: steps.db.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p artifacts
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" gen types typescript --local > artifacts/database.types.ts
          cp artifacts/database.types.ts src/integrations/supabase/types.ts
          if ! git diff --quiet -- src/integrations/supabase/types.ts; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/integrations/supabase/types.ts
            git commit -m "chore(b12): sync generated Supabase types [skip ci]"
            git push origin HEAD:dev
          fi
          diff -u artifacts/database.types.ts src/integrations/supabase/types.ts

      - name: Limpar Supabase local
        if: always() && steps.cli.outcome == 'success'
        continue-on-error: true
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --no-backup || true

      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          VITE_APP_ENV: development
          VITE_CI_RUNTIME_SMOKE: "true"
          VITE_SUPABASE_URL: https://jmtyurketfclaneqxohu.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_runtime_smoke_only_not_for_deployment
        run: npm run build:dev

      - name: Smoke no navegador
        id: browser
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          node scripts/run-browser-runtime-smoke.mjs
          node scripts/check-browser-network-isolation.mjs
          node scripts/run-browser-client-navigation-smoke.mjs

      - name: Exportar tipos gerados
        if: steps.types.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: database-types-${{ github.sha }}
          path: artifacts/database.types.ts
          retention-days: 1

      - name: Exportar evidência do navegador
        if: always() && steps.browser.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-${{ github.sha }}
          path: artifacts/browser-smoke
          retention-days: 1
          if-no-files-found: warn

      - name: Evidência
        if: always()
        uses: actions/github-script@v9
        env:
          INSTALL: ${{ steps.install.outcome }}
          LINT: ${{ steps.lint.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          CLI: ${{ steps.cli.outcome }}
          DB: ${{ steps.db.outcome }}
          TYPES: ${{ steps.types.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        with:
          script: |
            const githubApiHeaders = {
              accept: "application/vnd.github+json",
              "X-GitHub-Api-Version": "2026-03-10"
            };
            const gateOutcomes = [
              process.env.INSTALL,
              process.env.LINT,
              process.env.UNIT,
              process.env.CLI,
              process.env.DB,
              process.env.TYPES,
              process.env.TYPECHECK,
              process.env.BUILD,
              process.env.BROWSER
            ];
            const gateSucceeded = gateOutcomes.every((outcome) => outcome === "success");
            const gateFailed = gateOutcomes.some((outcome) => outcome === "failure");
            const gateIncomplete = gateOutcomes.some(
              (outcome) => outcome === "cancelled" || outcome === "skipped"
            );
            const gateSuperseded = !gateFailed && gateIncomplete;

            const evidence = await github.request("POST /repos/{owner}/{repo}/issues", {
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Gate técnico — ${context.sha.slice(0,12)}`,
              body: [
                `Commit validado: \`${context.sha}\``,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `npm ci: **${process.env.INSTALL}**`,
                `lint: **${process.env.LINT}**`,
                `testes unitários: **${process.env.UNIT}**`,
                `Supabase CLI: **${process.env.CLI}**`,
                `banco + pgTAP: **${process.env.DB}**`,
                `tipos: **${process.env.TYPES}**`,
                `TypeScript: **${process.env.TYPECHECK}**`,
                `build: **${process.env.BUILD}**`,
                `navegador: **${process.env.BROWSER}**`
              ].join('\n'),
              headers: githubApiHeaders
            });

            if (gateSucceeded) {
              await github.request("PATCH /repos/{owner}/{repo}/issues/{issue_number}", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: evidence.data.number,
                state: "closed",
                state_reason: "completed",
                headers: githubApiHeaders
              });

              const openGateEvidence = [];
              let reachedLastPage = false;
              for (let page = 1; page <= 100; page += 1) {
                const response = await github.request("GET /repos/{owner}/{repo}/issues", {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: "open",
                  per_page: 100,
                  page,
                  headers: githubApiHeaders
                });
                openGateEvidence.push(
                  ...response.data.filter((issue) => issue.pull_request === undefined)
                );
                if (response.data.length < 100) {
                  reachedLastPage = true;
                  break;
                }
              }

              if (!reachedLastPage) {
                throw new Error(
                  "A reconciliação B117 atingiu o limite de 100 páginas sem concluir a listagem."
                );
              }

              const supersededGateEvidence = openGateEvidence.filter(
                (issue) =>
                  issue.number < evidence.data.number &&
                  issue.title.startsWith("Gate técnico — ") &&
                  issue.user?.login === "github-actions[bot]" &&
                  issue.body?.includes("Commit validado:")
              );

              for (const issue of supersededGateEvidence) {
                await github.request("PATCH /repos/{owner}/{repo}/issues/{issue_number}", {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "not_planned",
                  headers: githubApiHeaders
                });
              }
            } else if (gateSuperseded) {
              await github.request("PATCH /repos/{owner}/{repo}/issues/{issue_number}", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: evidence.data.number,
                state: "closed",
                state_reason: "not_planned",
                headers: githubApiHeaders
              });
            }

      - name: Gate final
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          LINT: ${{ steps.lint.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          CLI: ${{ steps.cli.outcome }}
          DB: ${{ steps.db.outcome }}
          TYPES: ${{ steps.types.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          test "$INSTALL" = success
          test "$LINT" = success
          test "$UNIT" = success
          test "$CLI" = success
          test "$DB" = success
          test "$TYPES" = success
          test "$TYPECHECK" = success
          test "$BUILD" = success
          test "$BROWSER" = success
