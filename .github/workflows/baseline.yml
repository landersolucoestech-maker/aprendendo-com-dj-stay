name: Gate técnico

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths-ignore: ["docs/**"]

permissions:
  contents: write
  issues: write

concurrency:
  group: gate-dev
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Aplicar pacote funcional B12
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          payload="scripts/b12/payload.b64"
          if [ ! -f "$payload" ]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base64 --decode "$payload" > /tmp/b12-ui-payload.tar.gz
          echo "926af29257d1ff9467b13eb8ef1c8f65202835cded9787236082f79ab462fd35  /tmp/b12-ui-payload.tar.gz" | sha256sum -c -
          gzip -t /tmp/b12-ui-payload.tar.gz

          cat > /tmp/b12-expected-manifest.txt <<'EOF'
          .github/workflows/baseline.yml
          docs/refactor/10-course-cms.md
          docs/refactor/11-modules-lessons.md
          scripts/check-curriculum-cms-contract.mjs
          src/App.tsx
          src/components/CourseModulesSection.tsx
          src/components/admin/CurriculumEditorDialogs.tsx
          src/components/ui/calendar.tsx
          src/components/ui/chart.tsx
          src/components/ui/context-menu.tsx
          src/components/ui/dropdown-menu.tsx
          src/components/ui/input-otp.tsx
          src/components/ui/menubar.tsx
          src/components/ui/sonner.tsx
          src/contracts/curriculum-cms.ts
          src/hooks/use-toast.ts
          src/hooks/useAvatarUpload.ts
          src/hooks/useCourseImageUpload.ts
          src/hooks/useCurriculumCms.ts
          src/hooks/useLessonAssetUpload.ts
          src/pages/admin/CourseCurriculum.tsx
          src/pages/admin/CourseEditor.tsx
          src/pages/admin/CoursesAdmin.tsx
          EOF
          sed -i 's/^          //' /tmp/b12-expected-manifest.txt
          tar -tzf /tmp/b12-ui-payload.tar.gz | sort > /tmp/b12-actual-manifest.txt
          sort /tmp/b12-expected-manifest.txt > /tmp/b12-expected-sorted.txt
          diff -u /tmp/b12-expected-sorted.txt /tmp/b12-actual-manifest.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/b12-actual-manifest.txt; then
            echo "Manifesto contém caminho inseguro." >&2
            exit 1
          fi

          tar -xzf /tmp/b12-ui-payload.tar.gz
          rm -rf scripts/b12

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- \
            .github/workflows/baseline.yml \
            docs/refactor/10-course-cms.md \
            docs/refactor/11-modules-lessons.md \
            scripts/check-curriculum-cms-contract.mjs \
            scripts/b12 \
            src/App.tsx \
            src/components/CourseModulesSection.tsx \
            src/components/admin/CurriculumEditorDialogs.tsx \
            src/components/ui/calendar.tsx \
            src/components/ui/chart.tsx \
            src/components/ui/context-menu.tsx \
            src/components/ui/dropdown-menu.tsx \
            src/components/ui/input-otp.tsx \
            src/components/ui/menubar.tsx \
            src/components/ui/sonner.tsx \
            src/contracts/curriculum-cms.ts \
            src/hooks/use-toast.ts \
            src/hooks/useAvatarUpload.ts \
            src/hooks/useCourseImageUpload.ts \
            src/hooks/useCurriculumCms.ts \
            src/hooks/useLessonAssetUpload.ts \
            src/pages/admin/CourseCurriculum.tsx \
            src/pages/admin/CourseEditor.tsx \
            src/pages/admin/CoursesAdmin.tsx
          git diff --cached --check
          git commit -m "feat(b12): complete modules and lessons administration"
          git push origin HEAD:dev
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.apply.outputs.applied != 'true'
        with:
          node-version: 22.16.0
          cache: npm

      - name: Instalação limpa
        id: install
        if: steps.apply.outputs.applied != 'true'
        continue-on-error: true
        run: npm ci

      - name: Lint
        id: lint
        if: steps.apply.outputs.applied != 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: Configurar Supabase CLI
        id: cli
        if: steps.apply.outputs.applied != 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Reconstruir banco e executar pgTAP
        id: db
        if: steps.apply.outputs.applied != 'true' && steps.cli.outcome == 'success'
        continue-on-error: true
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
          supabase db reset --local --no-seed
          supabase test db

      - name: Gerar e sincronizar tipos
        id: types
        if: steps.apply.outputs.applied != 'true' && steps.db.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p artifacts
          supabase gen types typescript --local > artifacts/database.types.ts
          cp artifacts/database.types.ts src/integrations/supabase/types.ts
          if ! git diff --quiet -- src/integrations/supabase/types.ts; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/integrations/supabase/types.ts
            git commit -m "chore(b12): sync generated Supabase types [skip ci]"
            git push origin HEAD:dev
          fi
          diff -u artifacts/database.types.ts src/integrations/supabase/types.ts

      - name: Typecheck
        id: typecheck
        if: steps.apply.outputs.applied != 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Build
        id: build
        if: steps.apply.outputs.applied != 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          VITE_APP_ENV: development
          VITE_SUPABASE_URL: https://jmtyurketfclaneqxohu.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
        run: npm run build:dev

      - name: Exportar tipos gerados
        if: steps.apply.outputs.applied != 'true' && steps.types.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: database-types-${{ github.sha }}
          path: artifacts/database.types.ts
          retention-days: 1

      - name: Evidência
        if: always() && steps.apply.outputs.applied != 'true'
        uses: actions/github-script@v7
        env:
          INSTALL: ${{ steps.install.outcome }}
          LINT: ${{ steps.lint.outcome }}
          DB: ${{ steps.db.outcome }}
          TYPES: ${{ steps.types.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BUILD: ${{ steps.build.outcome }}
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Gate técnico — ${context.sha.slice(0,12)}`,
              body: [
                `Commit validado: \`${context.sha}\``,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `npm ci: **${process.env.INSTALL}**`,
                `lint: **${process.env.LINT}**`,
                `banco + pgTAP: **${process.env.DB}**`,
                `tipos: **${process.env.TYPES}**`,
                `TypeScript: **${process.env.TYPECHECK}**`,
                `build: **${process.env.BUILD}**`
              ].join('\n')
            });

      - name: Gate final
        if: always() && steps.apply.outputs.applied != 'true'
        env:
          INSTALL: ${{ steps.install.outcome }}
          LINT: ${{ steps.lint.outcome }}
          DB: ${{ steps.db.outcome }}
          TYPES: ${{ steps.types.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          test "$INSTALL" = success
          test "$LINT" = success
          test "$DB" = success
          test "$TYPES" = success
          test "$TYPECHECK" = success
          test "$BUILD" = success
