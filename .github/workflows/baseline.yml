name: Baseline técnico

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths-ignore:
      - "docs/**"

permissions:
  contents: read
  issues: write

concurrency:
  group: baseline-dev
  cancel-in-progress: false

jobs:
  baseline:
    name: Instalação, lint, typecheck e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Instalação limpa
        id: install
        continue-on-error: true
        run: npm ci

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Exportar snapshot integral do código-fonte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: |
            .
            !.git/**
            !node_modules/**
            !dist/**
          include-hidden-files: true
          retention-days: 1

      - name: Registrar evidência do baseline
        if: always()
        uses: actions/github-script@v7
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const shortSha = context.sha.slice(0, 12);
            const title = `Baseline B1 — ${shortSha}`;
            const body = [
              '## Evidência automática da Fase B1',
              '',
              `- Commit: \`${context.sha}\``,
              `- Branch: \`${context.ref.replace('refs/heads/', '')}\``,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Snapshot: \`source-${context.sha}\``,
              '',
              '| Etapa | Resultado |',
              '| --- | --- |',
              `| npm ci | ${process.env.INSTALL_OUTCOME} |`,
              `| npm run lint | ${process.env.LINT_OUTCOME || 'skipped'} |`,
              `| npx tsc --noEmit | ${process.env.TYPECHECK_OUTCOME || 'skipped'} |`,
              `| npm run build | ${process.env.BUILD_OUTCOME || 'skipped'} |`,
              '',
              'Esta issue é evidência técnica automática. Não representa aprovação de produção.'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });

      - name: Aplicar gate final
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          test "$INSTALL_OUTCOME" = "success"
          test "$LINT_OUTCOME" = "success"
          test "$TYPECHECK_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
