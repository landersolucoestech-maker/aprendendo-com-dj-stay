              navigate("/login", { replace: true });
            } finally {
              setIsSigningOut(false);
            }
          };

          if (!user) {
            return (
              <PageState
                variant="loading"
                title="Validando conta"
                description="Confirmando a sessão do aluno."
              />
            );
          }

          const orders''', '''  const historyQuery = useStudentPaymentHistory();
          const orders''', "session block"),
              ('''    <StudentPortalShell
              displayName={metadata?.fullName ?? user.email ?? "Aluno"}
              email={user.email ?? ""}
              isSigningOut={isSigningOut}
              onSignOut={() => void handleSignOut()}
            >''', "    <StudentPortalPageFrame>", "opening frame"),
              ("    </StudentPortalShell>", "    </StudentPortalPageFrame>", "closing frame"),
          ])

          migrate("src/pages/student/StudentCommunicationPreferences.tsx", [
              ('import { useEffect, useMemo, useState } from "react";\nimport { useNavigate } from "react-router-dom";\n\nimport { getUserMetadataProfile } from "@/auth/user-metadata";\nimport { useAuth } from "@/auth/use-auth";', 'import { useEffect, useState } from "react";', "imports"),
              ('import { StudentPortalShell } from "@/components/student/StudentPortalShell";', frame_import, "frame import"),
              ('  const { user, signOut } = useAuth();\n  const navigate = useNavigate();\n', "", "auth declarations"),
              ('  const [isSigningOut, setIsSigningOut] = useState(false);\n', "", "signout state"),
              ('''  const metadata = useMemo(() => {
            if (!user) return null;
            try {
              return getUserMetadataProfile(user);
            } catch {
              return null;
            }
          }, [user]);

          const handleSignOut = async () => {
            setIsSigningOut(true);
            try {
              await signOut();
              navigate("/login", { replace: true });
            } finally {
              setIsSigningOut(false);
            }
          };

          ''', "", "metadata and signout"),
              ('''  if (!user) {
            return (
              <PageState
                variant="loading"
                title="Validando conta"
                description="Confirmando a sessão do aluno."
              />
            );
          }

          ''', "", "auth loading"),
              ('''    <StudentPortalShell
              displayName={metadata?.fullName ?? user.email ?? "Aluno"}
              email={user.email ?? ""}
              isSigningOut={isSigningOut}
              onSignOut={() => void handleSignOut()}
            >''', "    <StudentPortalPageFrame>", "opening frame"),
              ("    </StudentPortalShell>", "    </StudentPortalPageFrame>", "closing frame"),
          ])

          migrate("src/pages/student/StudentPrivacyRights.tsx", [
              ('import { useMemo, useState } from "react";\nimport { useNavigate } from "react-router-dom";\n\nimport { getUserMetadataProfile } from "@/auth/user-metadata";\nimport { useAuth } from "@/auth/use-auth";', 'import { useState } from "react";', "imports"),
              ('import { StudentPortalShell } from "@/components/student/StudentPortalShell";', frame_import, "frame import"),
              ('  const { user, signOut } = useAuth();\n  const navigate = useNavigate();\n', "", "auth declarations"),
              ('  const [isSigningOut, setIsSigningOut] = useState(false);\n', "", "signout state"),
              ('''  const metadata = useMemo(() => {
            if (!user) return null;
            try {
              return getUserMetadataProfile(user);
            } catch {
              return null;
            }
          }, [user]);

          const handleSignOut = async () => {
            setIsSigningOut(true);
            try {
              await signOut();
              navigate("/login", { replace: true });
            } finally {
              setIsSigningOut(false);
            }
          };

          ''', "", "metadata and signout"),
              ('''  if (!user) {
            return <PageState variant="loading" title="Validando conta" description="Confirmando sua sessão." />;
          }

          ''', "", "auth loading"),
              ('''    <StudentPortalShell
              displayName={metadata?.fullName ?? user.email ?? "Aluno"}
              email={user.email ?? ""}
              isSigningOut={isSigningOut}
              onSignOut={() => void handleSignOut()}
            >''', "    <StudentPortalPageFrame>", "opening frame"),
              ("    </StudentPortalShell>", "    </StudentPortalPageFrame>", "closing frame"),
          ])

      - name: Remover workflow temporário
        run: rm .github/workflows/patch-b86-student-frames.yml

      - name: Publicar migração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/student/StudentFavorites.tsx src/pages/student/StudentNotifications.tsx src/pages/student/StudentSupport.tsx src/pages/student/StudentFinancialPortal.tsx src/pages/student/StudentCommunicationPreferences.tsx src/pages/student/StudentPrivacyRights.tsx .github/workflows/patch-b86-student-frames.yml
          git diff --cached --quiet && exit 0
          git commit -m "refactor(b86): centralizar wrappers do portal do aluno"
          git push origin HEAD:dev

# trigger: b86-student-frames
