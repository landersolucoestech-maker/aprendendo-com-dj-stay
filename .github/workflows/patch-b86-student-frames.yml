          const handleSignOut = async () => {
            setIsSigningOut(true);
            try {
              await signOut();
              navigate("/login", { replace: true });
            } finally {
              setIsSigningOut(false);
            }
          };

          if (!user) {
            return <PageState variant="loading" title="Validando conta" description="Confirmando a sessão do aluno." />;
          }

          const data''', '''  const notificationsQuery = useStudentNotifications();
          const markRead = useMarkStudentNotificationRead();
          const markAllRead = useMarkAllStudentNotificationsRead();
          const data''', "session block"),
              ('''    <StudentPortalShell
              displayName={metadata?.fullName ?? user.email ?? "Aluno"}
              email={user.email ?? ""}
              isSigningOut={isSigningOut}
              onSignOut={() => void handleSignOut()}
            >''', "    <StudentPortalPageFrame>", "opening frame"),
              ("    </StudentPortalShell>", "    </StudentPortalPageFrame>", "closing frame"),
          ])

          migrate("src/pages/student/StudentSupport.tsx", [
              ('import { useMemo, useState } from "react";\nimport { useNavigate } from "react-router-dom";\n\nimport { getUserMetadataProfile } from "@/auth/user-metadata";\nimport { useAuth } from "@/auth/use-auth";', 'import { useState } from "react";', "imports"),
              ('import { StudentPortalShell } from "@/components/student/StudentPortalShell";', frame_import, "frame import"),
              ('  const { user, signOut } = useAuth();\n  const navigate = useNavigate();\n', "", "auth declarations"),
              ('  const [isSigningOut, setIsSigningOut] = useState(false);\n', "", "signout state"),
              ('''  const metadata = useMemo(() => {
            if (!user) return null;
            try {
              return getUserMetadataProfile(user);
            } catch {
              return null;
            }
          }, [user]);

          const handleSignOut = async () => {
            setIsSigningOut(true);
            try {
              await signOut();
              navigate("/login", { replace: true });
            } finally {
              setIsSigningOut(false);
            }
          };

          ''', "", "metadata and signout"),
              ('''  if (!user) {
            return <PageState variant="loading" title="Validando conta" />;
          }

          ''', "", "auth loading"),
              ('''    <StudentPortalShell
              displayName={metadata?.fullName ?? user.email ?? "Aluno"}
              email={user.email ?? ""}
              isSigningOut={isSigningOut}
              onSignOut={() => void handleSignOut()}
            >''', "    <StudentPortalPageFrame>", "opening frame"),
              ("    </StudentPortalShell>", "    </StudentPortalPageFrame>", "closing frame"),
          ])

          migrate("src/pages/student/StudentFinancialPortal.tsx", [
              ('import { useMemo, useState } from "react";\nimport { useNavigate } from "react-router-dom";\n\nimport { getUserMetadataProfile } from "@/auth/user-metadata";\nimport { useAuth } from "@/auth/use-auth";', "", "imports"),
              ('import { StudentPortalShell } from "@/components/student/StudentPortalShell";', frame_import, "frame import"),
              ('''  const { user, signOut } = useAuth();
          const navigate = useNavigate();
          const [isSigningOut, setIsSigningOut] = useState(false);
          const historyQuery = useStudentPaymentHistory();
          const metadata = useMemo(() => {
            if (!user) return null;
            try {
