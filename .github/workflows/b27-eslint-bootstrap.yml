name: B27 ESLint bootstrap

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/b27-eslint-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: b27-eslint-bootstrap-dev
  cancel-in-progress: false

jobs:
  align-eslint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Alinhar typescript-eslint e lockfile
        run: node scripts/apply-b27-eslint-alignment.mjs
