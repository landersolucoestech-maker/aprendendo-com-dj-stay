name: Diagnóstico de importação B76

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/diagnose-b76-import.yml"

permissions:
  contents: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Capturar saída integral do teste principal
        id: tests
        continue-on-error: true
        run: |
          set +e
          npx vitest run --config vitest.config.ts \
            src/contracts/course-access.test.ts \
            --reporter=verbose > /tmp/b76-import.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit $status
      - name: Publicar cauda integral
        if: always()
        uses: actions/github-script@v9
        env:
          EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        with:
          script: |
            const fs = require("node:fs");
            const raw = fs.existsSync("/tmp/b76-import.log")
              ? fs.readFileSync("/tmp/b76-import.log", "utf8")
              : "Log não produzido.";
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Importação B76 — ${context.sha.slice(0, 12)}`,
              body: [
                `Commit: \`${context.sha}\``,
                `Exit code: \`${process.env.EXIT_CODE ?? "unknown"}\``,
                "",
                "```text",
                raw.slice(-15000),
                "```",
              ].join("\n"),
            });
      - name: Remover workflow temporário
        if: always()
        run: |
          rm .github/workflows/diagnose-b76-import.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/diagnose-b76-import.yml
          git commit -m "chore(b76): remover diagnóstico de importação"
          git push origin HEAD:dev
