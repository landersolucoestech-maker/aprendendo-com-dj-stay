name: Patch B85 Contract Bridges

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-b85-contract-bridges.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Alinhar contratos B79 B23 B83 B84
        shell: python
        run: |
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              if new in source:
                  return source
              if old not in source:
                  raise SystemExit(f"Marcador ausente: {label}")
              return source.replace(old, new, 1)

          # B79
          path = Path("scripts/check-profile-contract-tests.mjs")
          source = path.read_text(encoding="utf-8")
          source = replace_once(
              source,
              '  editPage: "src/pages/EditProfile.tsx",\n',
              '  editPage: "src/pages/EditProfile.tsx",\n  app: "src/App.tsx",\n  studentPortal: "src/pages/student/StudentPortal.tsx",\n  pageFrame: "src/components/student/StudentPortalPageFrame.tsx",\n',
              "paths B79",
          )
          source = replace_once(
              source,
              'const editPage = read(paths.editPage);\n',
              'const editPage = read(paths.editPage);\nconst app = read(paths.app);\nconst studentPortal = read(paths.studentPortal);\nconst pageFrame = read(paths.pageFrame);\n',
              "reads B79",
          )
          source = replace_once(
              source,
              'for (const fragment of [\n  "profileMetadataInputSchema",\n  \'supabase.auth.updateUser({\',',
              'for (const fragment of [\n  "EditProfileProps",\n  "studentPortal = false",\n  "<StudentPortalPageFrame>",\n  "profileMetadataInputSchema",\n  \'supabase.auth.updateUser({\',',
              "editor fragments B79",
          )
          marker = '''for (const fragment of [
            "user_profiles: {",'''
          bridge = '''expect(
            app.includes('path="/aluno/perfil/editar" element={<StudentRoute><EditProfile studentPortal /></StudentRoute>}'),
            "Rota do aluno deve ativar o modo studentPortal do editor.",
          );
          expect(
            app.includes('path="/editar-perfil"') && app.includes("<EditProfile />"),
            "Rota genérica deve preservar EditProfile sem modo aluno.",
          );
          expect(
            studentPortal.includes('<Link to="/aluno/perfil/editar">Editar perfil</Link>'),
            "Perfil do aluno deve apontar para o editor dentro do shell.",
          );
          for (const fragment of [
            "getUserMetadataProfile",
            "<StudentPortalShell",
            'navigate("/login", { replace: true })',
          ]) {
            expect(pageFrame.includes(fragment), `Frame B85 ausente no contrato B79: ${fragment}`);
          }

          '''
          if bridge not in source:
              if marker not in source:
                  raise SystemExit("Marcador de ponte B79 ausente")
              source = source.replace(marker, bridge + marker, 1)
          source = source.replace(
              'console.error("Falhas no contrato B79:\\n- " + failures.join("\\n- "));',
              'console.error("Falhas no contrato B79/B85:\\n- " + failures.join("\\n- "));',
          )
          source = source.replace(
              '"Contrato B79 aprovado: perfil persistido, metadados de leitura e gravação, limites exatos e vínculo de avatar compartilham validação canônica e cobertura determinística.",',
              '"Contrato B79/B85 aprovado: perfil persistido, gravação canônica, vínculo de avatar e modo aluno no shell permanecem cobertos sem duplicação.",',
          )
          path.write_text(source, encoding="utf-8")

          # B23
          path = Path("scripts/check-design-system-contract.mjs")
          source = path.read_text(encoding="utf-8")
          source = replace_once(
              source,
              '  "src/pages/student/MyDigitalProducts.tsx",\n',
              '  "src/pages/student/MyDigitalProducts.tsx",\n  "src/pages/EditProfile.tsx",\n',
              "required file B23",
          )
          marker = '''requireText("src/pages/student/StudentPortal.tsx", ['''
          bridge = '''requireText("src/pages/EditProfile.tsx", [
            "<StudentPortalPageFrame>",
            "<StudentSectionHeader",
            'variant={studentPortal ? "course" : undefined}',
            'variant={studentPortal ? "context" : "default"}',
          ]);

          '''
          if bridge not in source:
              if marker not in source:
                  raise SystemExit("Marcador B23 editor ausente")
              source = source.replace(marker, bridge + marker, 1)
          source = source.replace(
              'console.log("Contrato estático do Portal do Aluno na FASE B23/B84 aprovado com contexto visual delegado pelo shell.");',
              'console.log("Contrato estático do Portal do Aluno na FASE B23/B84/B85 aprovado com contexto visual delegado pelo shell e modo aluno do editor.");',
          )
          path.write_text(source, encoding="utf-8")

          # B83
          path = Path("scripts/check-student-navigation.mjs")
          source = path.read_text(encoding="utf-8")
          source = replace_once(
              source,
              '  products: "src/pages/student/MyDigitalProducts.tsx",\n',
              '  products: "src/pages/student/MyDigitalProducts.tsx",\n  editProfile: "src/pages/EditProfile.tsx",\n  studentPortal: "src/pages/student/StudentPortal.tsx",\n',
              "paths B83",
          )
          source = replace_once(
              source,
              'const products = read(paths.products);\n',
              'const products = read(paths.products);\nconst editProfile = read(paths.editProfile);\nconst studentPortal = read(paths.studentPortal);\n',
              "reads B83",
          )
          marker = '''for (const fragment of [
            "<StudentPortalShell",'''
          bridge = '''expect(
            app.includes('path="/aluno/perfil/editar" element={<StudentRoute><EditProfile studentPortal /></StudentRoute>}'),
            "Rota específica de edição deve ativar o shell do aluno.",
          );
          expect(
            studentPortal.includes('<Link to="/aluno/perfil/editar">Editar perfil</Link>'),
            "A ação Editar perfil deve usar a rota específica do aluno.",
          );
          expect(
            editProfile.includes("<StudentPortalPageFrame>"),
            "O editor do aluno deve preservar o frame compartilhado.",
          );

          '''
          if bridge not in source:
              if marker not in source:
                  raise SystemExit("Marcador de ponte B83 ausente")
              source = source.replace(marker, bridge + marker, 1)
          source = source.replace(
              '`Contrato B83/B84 aprovado: ${navigationRoutes.length} rotas principais permanecem disponíveis no menu desktop/mobile e as novas entradas preservam o shell.`,',
              '`Contrato B83/B84/B85 aprovado: ${navigationRoutes.length} rotas principais permanecem no menu, a rota de detalhe permanece fora do menu e Editar perfil preserva o shell.`,',
          )
          path.write_text(source, encoding="utf-8")

          # B84
          path = Path("scripts/check-student-page-frame.mjs")
          source = path.read_text(encoding="utf-8")
          source = replace_once(
              source,
              '  products: "src/pages/student/MyDigitalProducts.tsx",\n',
              '  products: "src/pages/student/MyDigitalProducts.tsx",\n  editProfile: "src/pages/EditProfile.tsx",\n  studentPortal: "src/pages/student/StudentPortal.tsx",\n',
              "paths B84",
          )
          source = replace_once(
              source,
              'const products = read(paths.products);\n',
              'const products = read(paths.products);\nconst editProfile = read(paths.editProfile);\nconst studentPortal = read(paths.studentPortal);\n',
              "reads B84",
          )
          marker = '''expect(
            app.includes('path="/aluno/produtos"'''
          bridge = '''for (const fragment of [
            "EditProfileProps",
            "studentPortal = false",
            "<StudentPortalPageFrame>",
            "profileMetadataInputSchema",
            "useAvatarUpload()",
          ]) {
            expect(editProfile.includes(fragment), `Editor de perfil B85 ausente no frame: ${fragment}`);
          }
          expect(
            app.includes('path="/aluno/perfil/editar" element={<StudentRoute><EditProfile studentPortal /></StudentRoute>}'),
            "Rota de edição do aluno deve ativar o frame.",
          );
          expect(
            studentPortal.includes('<Link to="/aluno/perfil/editar">Editar perfil</Link>'),
            "Perfil do aluno deve abrir o editor no shell.",
          );

          '''
          if bridge not in source:
              if marker not in source:
                  raise SystemExit("Marcador de ponte B84 ausente")
              source = source.replace(marker, bridge + marker, 1)
          source = source.replace(
              '"Contrato B84 aprovado: certificados e produtos do aluno preservam o shell e o contexto visual compartilhados, enquanto a rota multi-papel mantém o layout genérico.",',
              '"Contrato B84/B85 aprovado: certificados, produtos e editor de perfil preservam o shell; a rota genérica multi-papel continua compatível.",',
          )
          path.write_text(source, encoding="utf-8")

      - name: Remover workflow temporário
        run: rm .github/workflows/patch-b85-contract-bridges.yml

      - name: Publicar pontes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-profile-contract-tests.mjs scripts/check-design-system-contract.mjs scripts/check-student-navigation.mjs scripts/check-student-page-frame.mjs .github/workflows/patch-b85-contract-bridges.yml
          git diff --cached --quiet && exit 0
          git commit -m "test(b85): alinhar contratos ao editor no shell"
          git push origin HEAD:dev
